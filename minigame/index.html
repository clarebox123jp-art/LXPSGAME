/* ══════════════════════════════════════════════════════════
 *  引擎 D:拖放分類(用手指真的把卡片拖進籃子)
 *  ★ 與舊的 sort 引擎差別:sort 是「按一顆按鈕」,體感和選擇題一樣;
 *    這裡是真的拖,小朋友的手要做出「歸類」這個動作,記憶會深得多。
 *  ★ 用 Pointer Events 統一處理滑鼠與觸控;舊 iPad 沒有 PointerEvent
 *    ⇒ 自動退回 touch/mouse 兩組監聽(見 _dragBind)。
 * ══════════════════════════════════════════════════════════ */
var _DG = null;   // { el, bins, startX, startY, dx, dy, hot }

function renderDrag(x, it){
  hide('card-area');
  show('dragbox');
  var d = $('drag-item');
  d.innerHTML = mgPicTag(it.pic, 'pic-drag') + esc(it.t) + '<span class="dgrip">用手指把它拖到正確的籃子</span>';   /* v1.3.0 預留:圖來了就是「拖圖片」 */
  d.className = '';
  d.style.transform = '';
  var wrap = $('drag-bins'), html = '', i, b;
  wrap.className = (x.bins.length === 2 ? 'two' : (x.bins.length >= 4 ? 'four' : 'three'));   /* v1.3.0:4 桶一列(有圖才放得下) */
  for(i = 0; i < x.bins.length; i++){
    b = x.bins[i];
    html += '<div class="dbin" data-i="' + i + '">'
          +   mgPicTag(b.pic, 'pic-bin') + '<span class="be">' + b.e + '</span>' + esc(b.n) + '</div>';
  }
  wrap.innerHTML = html;
  _dragBind(d);
}

function _dragBind(el){
  var moved = false;
  function down(e){
    if(MG.answered) return;
    var p = _pt(e);
    _DG = { el: el, startX: p.x, startY: p.y, hot: -1 };
    el.classList.add('dragging');
    moved = false;
    playSfx('sfx-tap', 0.28);
    if(e.preventDefault) e.preventDefault();
  }
  function move(e){
    if(!_DG) return;
    var p = _pt(e);
    var dx = p.x - _DG.startX, dy = p.y - _DG.startY;
    moved = true;
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(0.62)';   /* ★ v1.5.0 拖曳中縮小(原 1.04),別把籃子整排蓋住 */
    var hot = _binUnder(p.x, p.y);
    if(hot !== _DG.hot){
      _paintHot(hot);
      _DG.hot = hot;
      if(hot >= 0) playSfx('sfx-sel', 0.2);
    }
    if(e.preventDefault) e.preventDefault();
  }
  function up(e){
    if(!_DG) return;
    var hot = _DG.hot;
    el.classList.remove('dragging');
    _DG = null;
    _paintHot(-1);
    if(!moved || hot < 0){
      /* 沒拖到任何籃子 ⇒ 彈回原位,不算答錯(小朋友常常拖到一半手滑) */
      el.style.transform = '';
      return;
    }
    el.style.transform = '';
    mgAnswer(hot);
  }
  /* Pointer Events 優先;沒有的舊機退回 touch + mouse */
  if(window.PointerEvent){
    el.onpointerdown = function(e){ down(e); el.setPointerCapture && el.setPointerCapture(e.pointerId); };
    el.onpointermove = move;
    el.onpointerup = up;
    el.onpointercancel = up;
  }else{
    el.ontouchstart = down; el.ontouchmove = move; el.ontouchend = up; el.ontouchcancel = up;
    el.onmousedown = function(e){
      down(e);
      document.onmousemove = move;
      document.onmouseup = function(ev){ up(ev); document.onmousemove = null; document.onmouseup = null; };
    };
  }
}
/* 取事件座標(觸控與滑鼠通用) */
function _pt(e){
  if(e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if(e.changedTouches && e.changedTouches.length)
    return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
/* 這個座標落在第幾個籃子上?(用實際矩形判定,不用 elementFromPoint ——
   拖曳中的卡片會蓋在指尖下面,elementFromPoint 會一直回傳卡片自己) */
function _binUnder(cx, cy){
  var bins = $('drag-bins').getElementsByClassName('dbin'), i, r;
  for(i = 0; i < bins.length; i++){
    r = bins[i].getBoundingClientRect();
    if(cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) return i;
  }
  return -1;
}
function _paintHot(idx){
  var bins = $('drag-bins').getElementsByClassName('dbin'), i;
  for(i = 0; i < bins.length; i++){
    if(bins[i].className.indexOf('ok') >= 0 || bins[i].className.indexOf('ng') >= 0) continue;
    bins[i].className = 'dbin' + (i === idx ? ' hot' : '');
  }
}

/* ══════════════════════════════════════════════════════════
 *  引擎 E:順序排列(把卡片依正確順序一張一張放上去)
 *  ★ 教「先後關係」——節氣、製茶工序、溪流上下游、歷史年代,
 *    這些用選擇題問只能問單點,用排序才問得出「整條順序」。
 * ══════════════════════════════════════════════════════════ */
var _OD = null;   // { picked:[原始索引], items:[...] }

function renderOrder(x, r){
  hide('card-area');
  show('orderbox');

  _OD = { picked: [], items: r.seq, shuffled: shuffle(_idxList(r.seq.length)) };
  _orderPaint(r);
}
function _idxList(n){ var a = [], i; for(i = 0; i < n; i++) a.push(i); return a; }

function _orderPaint(r){
  var i, html = '';
  /* 上排:順序格 */
  for(i = 0; i < r.seq.length; i++){
    var fi = _OD.picked[i];
    html += '<div class="oslot' + (fi == null ? '' : ' filled') + '">'
          + (fi == null ? '<span style="opacity:.45;">' + (i + 1) + '</span>'
                        : (mgPicTag(r.pic && r.pic[fi], 'pic-card') + esc(r.seq[fi])))
          + '</div>';
  }
  $('order-slots').innerHTML = html;
  /* 下排:待選卡 */
  html = '';
  for(i = 0; i < _OD.shuffled.length; i++){
    var oi = _OD.shuffled[i];
    var used = false, k;
    for(k = 0; k < _OD.picked.length; k++){ if(_OD.picked[k] === oi) used = true; }
    html += '<button class="ocard' + (used ? ' used' : '') + '" '
          + 'onclick="mgOrderPick(' + oi + ')">' + mgPicTag(r.pic && r.pic[oi], 'pic-card') + esc(r.seq[oi]) + '</button>';
  }
  $('order-pool').innerHTML = html;
}
window.mgOrderPick = function(oi){
  if(MG.answered || !_OD) return;
  var r = MG.order[MG.idx];
  if(_OD.picked.length >= r.seq.length) return;
  _OD.picked.push(oi);
  playSfx('sfx-tap', 0.3);
  _orderPaint(r);
};
window.mgOrderUndo = function(){
  if(MG.answered || !_OD || !_OD.picked.length) return;
  _OD.picked.pop();
  playSfx('sfx-cancel', 0.3);
  _orderPaint(MG.order[MG.idx]);
};
window.mgOrderSubmit = function(){
  if(MG.answered || !_OD) return;
  var r = MG.order[MG.idx];
  if(_OD.picked.length < r.seq.length){
    toast('還有格子沒有放喔');
    playSfx('sfx-cancel', 0.3);
    return;
  }
  /* seq 在資料表裡就是「正確順序」,所以答對 = picked 剛好是 0,1,2,3… */
  var ok = true, i;
  for(i = 0; i < _OD.picked.length; i++){ if(_OD.picked[i] !== i) ok = false; }
  MG.answered = true;
  stopTimer();
  if(!ok){
    /* 錯了要把正解顯示出來,不然學生不知道正確順序長怎樣 = 沒學到東西 */
    _OD.picked = _idxList(r.seq.length);
    _orderPaint(r);
  }
  scoreIt(ok);
  if(ok){ var _oc = mgCenterOf('orderbox'); mgFx('tea', _oc.x, _oc.y, 200, 1400); }   /* 泡好一杯茶 */
  showFeedback(ok, ok ? '✅ 順序完全正確!' : '❌ 正確順序已經幫你排好了', tx(r.why));
};

/* ══════════════════════════════════════════════════════════
 *  引擎 G:反應點擊(老師指定 A)
 *  「天上掉下許多候選答案,點擊正確答案加分,點到錯的扣分。」
 *
 *  ★ 實作要點:
 *    - 用 requestAnimationFrame 跑掉落,不用 CSS animation:
 *      需要隨時知道每顆的座標才能判定「掉出畫面 = 漏接」。
 *    - 位移一律走 transform(GPU 合成),不動 top/left ——
 *      舊 iPad 上改 top 會每幀觸發 layout,掉幀會很明顯。
 *    - **漏接正確答案不扣分**,只有「點到錯的」才扣。
 *      小學生手速差異很大,漏接扣分會讓慢的孩子一路負分而放棄。
 * ══════════════════════════════════════════════════════════ */
var _RC = null;   // { drops:[], raf, last, spawnT, got, need, wrong, endAt }

function renderReact(x, r){
  hide('card-area');
  show('reactbox'); show('react-hud');
  $('qcard').textContent = tx(r.q);
  var box = $('reactbox');
  /* ★ v1.4.0(老師:「點擊特效改成射擊」)— 底部固定一座砲台,點到算式 = 從砲台射出一顆光彈飛過去命中 */
  box.innerHTML = '<div class="rgun" id="rgun">' + mgPicTag('coinrush_gun', 'pic-coin') + '🔫</div>';
  var dur = (r.sec || x.time || 22) * 1000;
  _RC = {
    drops: [], raf: 0, last: 0, spawnT: 0, got: 0, wrong: 0,
    hardHits: 0, blown: 0, paused: false,   /* ★ v1.4.0 高難度命中數／被炸掉的正確算式數 */
    need: (r.need || 6), r: r,
    endAt: (new Date()).getTime() + dur, total: dur
  };
  _reactHud();
  box.onclick = null;
  _RC.raf = requestAnimationFrame(_reactTick);
}
function _reactHud(){
  if(!_RC) return;
  $('react-got').textContent = '🎯 擊中 ' + _RC.got + ' / ' + _RC.need
                             + (_RC.wrong ? ('　💥 誤擊 ' + _RC.wrong) : '');
  $('react-tip').textContent = tx(_RC.r.tip || { f:'只射正確的算式!發光的算兩倍,射錯會爆炸', s:'只射對的!發光的算兩倍' });
}
/* ★ v1.4.0 — 射擊:砲台轉向目標 → 光彈飛過去(CSS transition 130ms)→ 到達才結算命中/誤擊。
   ⚠ 掉落物在飛行期間仍會往下掉幾個像素,光彈瞄準的是「按下當下」的位置,視覺上剛好。 */
function _reactShoot(d){
  if(!_RC || d.dead || d.locked || _RC.paused) return;
  d.locked = true;
  var box = $('reactbox'), bw = box.clientWidth, bh = box.clientHeight;
  var ew = d.el.offsetWidth || 90, eh = d.el.offsetHeight || 44;
  var tx0 = d.x + ew / 2, ty0 = d.y + eh / 2;
  var gx = bw / 2, gy = bh - 26;
  try{
    var g = $('rgun');
    if(g){
      var ang = Math.atan2(ty0 - gy, tx0 - gx) * 180 / Math.PI + 90;
      g.style.transform = 'translateX(-50%) rotate(' + ang + 'deg)';
    }
  }catch(e){}
  var b = document.createElement('div');
  b.className = 'rbullet';
  b.style.left = '0px'; b.style.top = '0px';
  b.style.transform = 'translate(' + (gx - 7) + 'px,' + (gy - 7) + 'px)';
  box.appendChild(b);
  playSfx('sfx-tap', 0.3);
  /* 下一幀才設終點,transition 才會動 */
  requestAnimationFrame(function(){
    b.style.transform = 'translate(' + (tx0 - 7) + 'px,' + (ty0 - 7) + 'px)';
  });
  setTimeout(function(){
    if(b.parentNode) b.parentNode.removeChild(b);
    _reactHit(d);
  }, 140);
}
/* ★ v1.4.0 — 誤擊爆炸:煙霧爆開.gif 在該顆位置炸開,半徑 R 內其他掉落物(含正確的)一起炸掉消失 */
function _reactBlast(d){
  var box = $('reactbox'), bw = box.clientWidth;
  var ew = d.el.offsetWidth || 90, eh = d.el.offsetHeight || 44;
  var cx = d.x + ew / 2, cy = d.y + eh / 2;
  var R = bw >= 700 ? 190 : 150;
  try{
    var im = document.createElement('img');
    im.className = 'rboom';
    im.src = MG_FX.boom + '?v=' + MG_VER + '&t=' + Date.now();
    im.style.left = cx + 'px'; im.style.top = cy + 'px';
    im.onerror = function(){ if(im.parentNode) im.parentNode.removeChild(im); };
    box.appendChild(im);
    setTimeout(function(){ if(im.parentNode) im.parentNode.removeChild(im); }, 900);
  }catch(e){}
  var i, o, ox, oy;
  for(i = 0; i < _RC.drops.length; i++){
    o = _RC.drops[i];
    if(o === d || o.dead || !o.el || !o.el.parentNode) continue;
    ox = o.x + (o.el.offsetWidth || 90) / 2; oy = o.y + (o.el.offsetHeight || 44) / 2;
    if(Math.sqrt((ox - cx) * (ox - cx) + (oy - cy) * (oy - cy)) <= R){
      o.dead = true;
      if(o.good) _RC.blown++;
      o.el.className += ' blown';
      (function(el){ setTimeout(function(){ if(el && el.parentNode) el.parentNode.removeChild(el); }, 380); })(o.el);
    }
  }
}
function _reactSpawn(){
  var r = _RC.r, box = $('reactbox');
  var isGood = Math.random() < 0.45;               // 好壞比約 45 / 55
  var pool = isGood ? r.good : r.bad;
  var raw = pool[Math.floor(Math.random() * pool.length)];
  /* ★ v1.4.0 — 資料表條目可為字串或 {t:'算式', hard:true}:hard = 較難題,金框發光、命中算兩倍 */
  var txt = (typeof raw === 'string') ? raw : String(raw.t || '');
  var hard = !!(isGood && raw && typeof raw === 'object' && raw.hard);
  var el = document.createElement('div');
  /* ★ v1.4.1 老師:「答案太明顯,全部答案都要相同顏色」—— 對錯外觀完全一致(不再加 .bad、圖也同一張);
     hard 金框仍保留(那是「難度」標示,不洩漏對錯:錯的不會發光但正確的也大多不發光)。 */
  el.className = 'rdrop' + (hard ? ' hard' : '');
  el.innerHTML = mgPicTag(hard ? 'coinrush_coin_bonus' : 'coinrush_coin_gold', 'pic-coin') + esc(txt)
               + (hard ? '<span class="rx2">×2</span>' : '');   /* v1.3.0 預留硬幣圖 */
  el.style.left = '0px'; el.style.top = '0px';
  box.appendChild(el);
  var bw = box.clientWidth, ew = el.offsetWidth || 90;
  var d = {
    el: el, good: isGood, hard: hard,
    x: Math.random() * Math.max(1, bw - ew - 8) + 4,
    y: -54,
    v: 31 + Math.random() * 26,                    // px/秒;★ v1.4.1 老師:「降落速度整體放慢 50%」(原 62+0~52)
    dead: false, locked: false
  };
  el.onclick = function(ev){ if(ev && ev.stopPropagation) ev.stopPropagation(); _reactShoot(d); };   /* ★ v1.4.0 改射擊 */
  _RC.drops.push(d);
}
function _reactHit(d){
  if(!_RC || d.dead) return;
  d.dead = true;
  if(d.good){
    /* ★ v1.4.0 高難度(發光)命中算兩倍 */
    var _gain = d.hard ? 2 : 1;
    _RC.got += _gain;
    if(d.hard) _RC.hardHits++;
    d.el.className = 'rdrop hit';
    playSfx('sfx-ok', 0.45);
    try{ var _r = d.el.getBoundingClientRect(); mgFx('spark', _r.left + _r.width / 2, _r.top + _r.height / 2, d.hard ? 170 : 120, 600); }catch(e){}
    _reactFloat(d, '+' + _gain, '#3ec87a');
  }else{
    _RC.wrong++;
    d.el.className = 'rdrop wrong';
    playSfx('sfx-ng', 0.4);
    _reactFloat(d, '−1', '#e84040');
    _reactBlast(d);   /* ★ v1.4.0 誤擊 = 爆炸,附近的算式一起炸消失 */
  }
  _reactHud();
  /* 被點到的那顆 0.35 秒後移走(留一下讓孩子看到回饋) */
  var el = d.el;
  setTimeout(function(){ if(el && el.parentNode) el.parentNode.removeChild(el); }, 350);
}
function _reactFloat(d, txt, color){
  var f = document.createElement('div');
  f.className = 'rfloat';
  f.textContent = txt;
  f.style.color = color;
  f.style.left = d.x + 'px';
  f.style.top = d.y + 'px';
  $('reactbox').appendChild(f);
  setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 800);
}
function _reactTick(ts){
  if(!_RC) return;
  if(!_RC.last) _RC.last = ts;
  var dt = Math.min(0.05, (ts - _RC.last) / 1000);   // 夾住 dt:切到背景再回來不會瞬移
  _RC.last = ts;

  /* 產生新的掉落物 */
  _RC.spawnT -= dt;
  if(_RC.spawnT <= 0){
    _reactSpawn();
    _RC.spawnT = 0.55 + Math.random() * 0.45;
  }
  /* 位移 + 掉出畫面就回收(漏接正確答案不扣分,見上方註解) */
  var h = $('reactbox').clientHeight, i, d;
  for(i = _RC.drops.length - 1; i >= 0; i--){
    d = _RC.drops[i];
    if(!d.el || !d.el.parentNode){ _RC.drops.splice(i, 1); continue; }
    if(!d.dead){
      d.y += d.v * dt;
      d.el.style.transform = 'translate(' + d.x + 'px,' + d.y + 'px)';
      if(d.y > h + 10){
        d.el.parentNode.removeChild(d.el);
        _RC.drops.splice(i, 1);
      }
    }
  }
  /* 進度條沿用既有那條(時間軸),不另做一條 */
  var leftMs = _RC.endAt - (new Date()).getTime();
  var pct = Math.max(0, leftMs / _RC.total) * 100;
  var bar = $('timebar');
  if(bar){
    bar.style.width = pct + '%';
    if(pct <= 30) bar.classList.add('low'); else bar.classList.remove('low');
  }
  if(leftMs <= 0 || _RC.got >= _RC.need){ _reactFinish(); return; }
  _RC.raf = requestAnimationFrame(_reactTick);
}
function _reactFinish(){
  if(!_RC || MG.answered) return;
  if(_RC.raf) cancelAnimationFrame(_RC.raf);
  MG.answered = true;
  stopTimer();
  var r = _RC.r, got = _RC.got, wrong = _RC.wrong, need = _RC.need, hh = _RC.hardHits, blown = _RC.blown;
  $('reactbox').innerHTML = '';
  var ok = (got >= need && wrong <= 1);
  scoreIt(ok);
  /* ★ v1.4.0 高難度命中另加分(每次 +40),寫回分數列 */
  if(hh > 0){
    MG.score += hh * 40;
    $('score').textContent = MG.score + ' 分';
  }
  var _extra = (hh > 0 ? (',高難度 ×2 命中 ' + hh + ' 次') : '') + (blown > 0 ? (',被炸掉 ' + blown + ' 個正確算式') : '');
  showFeedback(ok,
    ok ? ('✅ 擊中 ' + got + ' 分,誤擊 ' + wrong + ' 次' + _extra + '!')
       : ('🔶 擊中 ' + got + ' / ' + need + ',誤擊 ' + wrong + ' 次' + _extra),
    tx(r.why));
  _RC = null;
}

/* ══════════════════════════════════════════════════════════
 *  引擎 F:翻牌配對(記憶 + 配對)
 *  ★ 一次翻兩張,配成一對才留著。考的是「記位置」加「知道誰跟誰是一組」。
 * ══════════════════════════════════════════════════════════ */
var _MC = null;   // { cards:[{txt,pair}], open:[i], done:0, tries:0, lock:false }

function renderMatch(x, r){
  hide('card-area');
  show('matchbox');
  $('qcard').textContent = tx(r.q);
  var cards = [], i;
  for(i = 0; i < r.pairs.length; i++){
    cards.push({ txt: r.pairs[i][0], pair: i });
    cards.push({ txt: r.pairs[i][1], pair: i });
  }
  _MC = { cards: shuffle(cards), open: [], done: 0, tries: 0, lock: false };
  _matchPaint();
}
function _matchPaint(){
  var html = '', i, c, cls;
  for(i = 0; i < _MC.cards.length; i++){
    c = _MC.cards[i];
    cls = 'mcard';
    if(c.done) cls += ' done';
    else if(_MC.open.indexOf(i) >= 0) cls += ' open';
    html += '<div class="' + cls + '" onclick="mgMatchTap(' + i + ')">' + mgPicTag('proverb_mc_back', 'pic-back') + esc(c.txt) + '</div>';   /* v1.3.0 預留卡背圖 */
  }
  $('matchbox').innerHTML = html;
}
window.mgMatchTap = function(i){
  if(MG.answered || !_MC || _MC.lock) return;
  var c = _MC.cards[i];
  if(c.done || _MC.open.indexOf(i) >= 0) return;
  _MC.open.push(i);
  playSfx('sfx-tap', 0.3);
  _matchPaint();
  if(_MC.open.length < 2) return;

  _MC.lock = true;
  _MC.tries++;
  var a = _MC.cards[_MC.open[0]], b = _MC.cards[_MC.open[1]];
  if(a.pair === b.pair){
    a.done = true; b.done = true;
    _MC.done++;
    _MC.open = [];
    _MC.lock = false;
    playSfx('sfx-ok', 0.45);
    _matchPaint();
    if(_MC.done >= _MC.cards.length / 2) _matchFinish();
  }else{
    /* 配錯:紅一下再蓋回去。0.75 秒剛好夠小朋友看清楚翻到什麼 */
    var els = $('matchbox').getElementsByClassName('mcard');
    if(els[_MC.open[0]]) els[_MC.open[0]].className = 'mcard miss';
    if(els[_MC.open[1]]) els[_MC.open[1]].className = 'mcard miss';
    playSfx('sfx-ng', 0.3);
    setTimeout(function(){
      _MC.open = []; _MC.lock = false; _matchPaint();
    }, 750);
  }
};
function _matchFinish(){
  MG.answered = true;
  stopTimer();
  var r = MG.order[MG.idx];
  /* 判定標準:翻牌次數不超過「對數 × 2」就算full marks。
     ⚠ 刻意不要求「零失誤」——記憶遊戲第一輪本來就一定得先翻開來看,
       要求零失誤等於逼小朋友用猜的,那就失去練記憶的意義了。 */
  var perfect = (_MC.tries <= r.pairs.length * 2);
  scoreIt(perfect);
  showFeedback(perfect,
    perfect ? ('✅ 全部配對成功!只用了 ' + _MC.tries + ' 次')
            : ('🔶 全部配對完成,用了 ' + _MC.tries + ' 次(' + (r.pairs.length * 2) + ' 次以內可以拿滿分)'),
    tx(r.why));
}

/* ══════════════════════════════════════════════════════════
 *  引擎 H:走迷宮(老師指定 B)
 *  「走過的地方不能再走,且要經過正確答案。」
 *
 *  ★ 地圖用字串陣列描述,一行一列(在資料表裡看起來就是一張圖,好維護):
 *      S = 起點   G = 終點   # = 牆   . = 空地
 *      其他英文字母 = 一個「答案格」,內容查 marks 表(t 文字 / ok 對不對)
 *  ★ 規則:
 *      - 只能走上下左右相鄰、且沒走過、且不是牆的格子(走過的變綠色,不能回頭)
 *      - 必須把所有 ok:true 的格子都踩過,再走到 G 才算過關
 *      - 踩到 ok:false 的陷阱格會扣分,但**不會直接判失敗**
 *        (小學生走錯一步就整關重來會很挫折,改成「還是能走完,只是分數低」)
 *      - 走到死路(四周都不能走)會提示重走,不當作答錯
 * ══════════════════════════════════════════════════════════ */
var _MZ = null;

function renderMaze(x, lv){
  /* ★ v1.3.1:原本 hide('card-area') 再寫 qcard ⇒ 題目「踩過所有○○」根本沒顯示過,
     學生只看到一堆地名不知道要挑什麼(老師:「內容太單調、提示要加強」的根源之一)。改為顯示題卡。 */
  show('card-area');
  show('mazebox');
  $('qcard').textContent = tx(lv.q);
  _mazeInit(lv);
}
function _mazeInit(lv){
  var h = lv.rows.length, w = lv.rows[0].length, r, c, ch, start = 0, needN = 0;
  var cells = [];
  for(r = 0; r < h; r++){
    for(c = 0; c < w; c++){
      ch = lv.rows[r].charAt(c);
      var m = (lv.marks && lv.marks[ch]) ? lv.marks[ch] : null;
      if(ch === 'S') start = r * w + c;
      if(m && m.ok) needN++;
      cells.push({ ch: ch, mark: m });
    }
  }
  _MZ = { lv: lv, w: w, h: h, cells: cells, pos: start,
          walked: [start], got: 0, need: needN, bad: 0, done: false,
          hintLv: 0, peek: -1, peekT: null };   /* ★ v1.3.1 提示狀態:hintLv 0/1/2、peek=亮出的正解格 */
  _mazePaint();
}
/* ★ v1.3.1(老師:「提示也要再加強」)— 💡 提示鈕:
   第 1 下:在 #maze-info 顯示這一關的文字線索(資料表 lv.hint,雙版)
   第 2 下起:亮出一格「還沒踩到、而且目前還走得到」的正解 3 秒(每按一次換下一格)
   ⚠ 不扣分:對小學生來說提示是學習輔助,不是懲罰;結算標題會註明「有用提示」。 */
window.mgMazeHint = function(){
  if(MG.answered || !_MZ || _MZ.done) return;
  playSfx('sfx-sel', 0.3);
  if(_MZ.hintLv === 0 && _MZ.lv.hint){
    _MZ.hintLv = 1; _mazePaint(); return;
  }
  _MZ.hintLv = 2;
  var cand = [], k, cell;
  for(k = 0; k < _MZ.cells.length; k++){
    cell = _MZ.cells[k];
    if(cell.mark && cell.mark.ok && _MZ.walked.indexOf(k) < 0) cand.push(k);
  }
  if(!cand.length){ toast('正確答案都找到了,快走到 🏁!'); return; }
  var idx = cand.indexOf(_MZ.peek);
  _MZ.peek = cand[(idx + 1) % cand.length];
  _MZ.used = (_MZ.used || 0) + 1;
  _mazePaint();
  if(_MZ.peekT) clearTimeout(_MZ.peekT);
  _MZ.peekT = setTimeout(function(){ if(_MZ){ _MZ.peek = -1; if(!_MZ.done) _mazePaint(); } }, 3000);

  /* v1.3.1:底下要放兩行提示文字 + 兩顆按鈕,保留 200px(原 130 會把按鈕擠出 iPad 橫式畫面) */

window.mgMazeStep = function(i){

  if(_MZ.cells[i].ch === 'G' && _MZ.got < _MZ.need){
    var k2, other = false;
    for(k2 = 0; k2 < _MZ.cells.length; k2++){ if(k2 !== i && _mazeReach(k2)) other = true; }

  _mazePaint();

  var k, alive = false;
  for(k = 0; k < _MZ.cells.length; k++){ if(_mazeReach(k)) alive = true; }

/* ══════════════════════════════════════════════════════════
 *  引擎 I:調色考驗(老師指定 C)

 *    所以改用「格子」當作區域:同一張圖切成 3 欄 × 4 列 = 12 格

 *    視覺上就是「顏色一格一格回來」,對小朋友很有成就感。
 *
 *  ★ 左邊刻意保留彩色原圖(老師的原始設計):
 *    難度不在「背answer」,而在「看得出這一格到底是什麼顏色」——
 *    這正是美術科要練的觀察與辨色。

var PAINTS = {

  blue:  { n:'藍', c:'#3b7de0' }, purple:{ n:'紫', c:'#8a5cd6' },
  brown: { n:'棕', c:'#8b5a2b' }, skin:  { n:'膚', c:'#f0c9a0' },
  black: { n:'黑', c:'#2f2f33' }, white: { n:'白', c:'#f2f2f0' }
};
var PAINT_COLS = 3, PAINT_ROWS = 4;
/* 立繪一律走 repo 既有的瘦身版 .jpg(約 110~240KB),
   ⚠ 不要改成 .png:同一張 png 是 900KB 級,本小程式的存在目的就是給網路差的學生秒開。 */
var HERO_IMG_BASE = 'https://raw.githubusercontent.com/clarebox123jp-art/LXPSGAME/main/';

var _PT = null;   // { pic, url, cells, left, wrong, pick, dragging }

function renderPaint(x, pic){

  var url = HERO_IMG_BASE + encodeURIComponent(pic.file);
  _PT = { pic: pic, url: url, done: [], left: pic.cells.length,
          wrong: 0, pick: null, dragging: false };

  /* 左:彩色參考圖(載不到就顯示提示,不讓畫面開天窗) */
  $('paint-ref').innerHTML =
    '<img src="' + url + '" alt="" '
    + 'onerror="this.parentNode.innerHTML=\'<div style=&quot;padding:14px;font-size:14px;opacity:.7;text-align:center;&quot;>圖片載入中或載入失敗<br>沒關係,還是可以憑感覺上色</div>\';">';

          + 'background-image:url(' + url + ');'

    var _availH = Math.max(220, window.innerHeight - _top - 150) - 30;   /* 30 = h4 標題列 */
    var _cols = _st.getElementsByClassName('pcol'), _ci;
    var _colW = Math.floor(_availH * 3 / 4);

function _paintNote(){

  var cells = $('paint-work').getElementsByClassName('pcell');

    cells[i].onclick = (function(el){
      return function(){

}
function _chipBind(chip){
  var pid = chip.getAttribute('data-p');
  var ghost = $('paint-drag');
  var moved = false;

  function down(e){
    if(MG.answered) return;
    _PT.pick = pid;
    _PT.dragging = true;
    moved = false;

    var p = _pt(e);

    ghost.style.left = (p.x - 23) + 'px';
    ghost.style.top = (p.y - 23) + 'px';

    if(e.preventDefault) e.preventDefault();
  }
  function move(e){
    if(!_PT || !_PT.dragging) return;
    moved = true;
    var p = _pt(e);
    ghost.style.left = (p.x - 23) + 'px';
    ghost.style.top = (p.y - 23) + 'px';
    _paintHotCell(_cellUnder(p.x, p.y));
    if(e.preventDefault) e.preventDefault();
  }
  function up(e){
    if(!_PT || !_PT.dragging) return;
    var p = _pt(e);
    var idx = _cellUnder(p.x, p.y);
    ghost.style.display = 'none';
    _paintHotCell(-1);
    _PT.dragging = false;
    /* 只是「點一下顏料」(沒有拖)⇒ 保持選取狀態,等他去點格子 */

function _paintPickPaint(){

/* 同 _binUnder 的理由:拖曳中的顏料球會蓋在指尖下面,不能用 elementFromPoint */
function _cellUnder(cx, cy){

  for(i = 0; i < cells.length; i++){
    r = cells[i].getBoundingClientRect();

function _paintHotCell(idx){

function _paintApply(idx, pid){

function _paintFinish(){

  scoreIt(ok);
  showFeedback(ok,
    ok ? ('✅ 上色完成!只塗錯 ' + wrong + ' 次') : ('🔶 上色完成,塗錯 ' + wrong + ' 次(2 次以內可以拿滿分)'),
    tx(pic.why));

/* ══════════════════════════════════════════════════════════
 *  引擎 J(v1.3.0):寵物調色工坊 colorq —「找出各區塊比例最多的色彩」(老師改版指示)

 *  ★ 區域切法必須與離線算法一致:圖以 object-fit:contain 放進 3:4 框,再以框的「中線」切半/切四。

 * ══════════════════════════════════════════════════════════ */
var PET_IMG_BASE = 'https://raw.githubusercontent.com/clarebox123jp-art/LXPSGAME/main/';
var CQ_REGION = {
  all:    { x:0,   y:0,   w:1,   h:1,   n:'全身'   },
  top:    { x:0,   y:0,   w:1,   h:0.5, n:'上半部' },
  bottom: { x:0,   y:0.5, w:1,   h:0.5, n:'下半部' },
  left:   { x:0,   y:0,   w:0.5, h:1,   n:'左半邊' },
  right:  { x:0.5, y:0,   w:0.5, h:1,   n:'右半邊' },
  tl:     { x:0,   y:0,   w:0.5, h:0.5, n:'左上角' },
  tr:     { x:0.5, y:0,   w:0.5, h:0.5, n:'右上角' },
  bl:     { x:0,   y:0.5, w:0.5, h:0.5, n:'左下角' },

/* 顏料色與名字:沿用引擎 I 的 PAINTS,補上寵物常見的灰與粉 */
PAINTS.gray = { n:'灰', c:'#9a9a9a' };
PAINTS.pink = { n:'粉', c:'#f28fb8' };
function cqColorName(k){ return (PAINTS[k] && PAINTS[k].n) ? PAINTS[k].n : k; }

function renderColorq(x, q){
  hide('card-area');
  show('colorqbox');
  $('qcard').textContent = tx(q.q);
  var reg = CQ_REGION[q.r] || CQ_REGION.all;
  var url = PET_IMG_BASE + encodeURIComponent(q.file);
  /* 左:去背寵物 + 亮區(其餘四分之一格壓暗)+ 金框 + 區域標籤 */
  var html = '<img src="' + url + '" alt="" onerror="this.style.display=\'none\';">';
  var qd = [[0,0],[0.5,0],[0,0.5],[0.5,0.5]], i;
  for(i = 0; i < 4; i++){
    var qx = qd[i][0], qy = qd[i][1];
    var inside = (qx >= reg.x - 0.001 && qx + 0.5 <= reg.x + reg.w + 0.001 &&
                  qy >= reg.y - 0.001 && qy + 0.5 <= reg.y + reg.h + 0.001);
    if(!inside) html += '<div class="cq-dim" style="left:' + (qx * 100) + '%;top:' + (qy * 100) + '%;"></div>';
  }
  html += '<div class="cq-frame" style="left:' + (reg.x * 100) + '%;top:' + (reg.y * 100) + '%;width:'
        + (reg.w * 100) + '%;height:' + (reg.h * 100) + '%;"></div>';
  html += '<div class="cq-tag">' + esc(q.pet) + ' · ' + reg.n + (q.t === 'second' ? ' · 第②多' : ' · 最多') + '</div>';
  $('cq-pic').innerHTML = html;
  /* 右:四個大色塊(順序由資料表固定,不在執行期洗牌,方便老師對答案) */
  html = '';
  for(i = 0; i < q.opts.length; i++){
    html += '<div class="cq-opt" data-i="' + i + '" style="background:' + cqColorHex(q.opts[i]) + ';" '
          + 'onclick="mgColorqPick(' + i + ')">' + esc(cqColorName(q.opts[i])) + '色</div>';
  }
  $('cq-opts').innerHTML = html;
  $('cq-note').textContent = (MG.style === 's')
    ? (q.t === 'second' ? '亮起來的地方,第二多的顏色是哪一個?(後面的格子不算)' : '亮起來的地方,哪個顏色最多?(後面的格子不算)')
    : (q.t === 'second' ? '仔細看亮起來的區域:面積第二多的是哪個顏色?(最多的那個不算;背景格紋不算)' : '仔細看亮起來的區域:面積最多的是哪個顏色?(只算寵物本身,背景格紋不算)');
  /* 圖高依剩餘高度夾一次(同 renderPaint 的口徑),iPad 橫式不捲動 */
  try{
    var _pic = $('cq-pic'), _top = _pic.getBoundingClientRect().top || 220;
    /* 橫式兩欄:解說在左欄,右欄只留 120px;直式單欄:解說+比例長條+下一題疊在圖下方,要預留 400px */
    var _twoCol = (window.innerWidth >= 1024 && window.innerWidth > window.innerHeight);
    var _availH = Math.max(220, window.innerHeight - _top - (_twoCol ? 120 : 440));
    _pic.style.width = Math.min(340, Math.floor(_availH * 3 / 4)) + 'px';
  }catch(e){}
}
window.mgColorqPick = function(i){
  if(MG.answered) return;
  var q = MG.order[MG.idx]; if(!q || !q.opts) return;
  var pick = q.opts[i], ok = (pick === q.a);
  MG.answered = true;
  stopTimer();
  var opts = $('cq-opts').getElementsByClassName('cq-opt'), k;
  for(k = 0; k < opts.length; k++){
    var key = q.opts[k];
    if(key === q.a) opts[k].className = 'cq-opt ok';
    else if(k === i) opts[k].className = 'cq-opt ng';
    else opts[k].className = 'cq-opt off';
  }
  scoreIt(ok);   /* scoreIt 內已累計 MG.right,不另加 */
  showFeedback(ok,
    ok ? '✅ 答對了!' : ('❌ 答案是「' + cqColorName(q.a) + '色」'),
    tx(q.why));
  /* 解說卡尾端補上比例長條(這才是本題真正要學的東西:比例) */
  try{
    var body = $('feedback').getElementsByClassName('fb-body')[0];
    if(body) body.insertAdjacentHTML('beforeend', cqBarsHtml(q));
  }catch(e){}
};
function cqBarsHtml(q){
  var h = '<div class="cq-bars">', i, mx = 0;
  for(i = 0; i < q.bars.length; i++) if(q.bars[i][1] > mx) mx = q.bars[i][1];
  for(i = 0; i < q.bars.length; i++){
    var c = q.bars[i][0], p = q.bars[i][1];
    var win = (c === q.a);
    h += '<div class="cq-bar' + (win ? ' win' : '') + '">'
       + '<span class="cqb-name">' + esc(cqColorName(c)) + '</span>'
       + '<span class="cqb-track"><span class="cqb-fill" style="width:' + Math.round(p / mx * 100) + '%;background:' + cqColorHex(c) + ';"></span></span>'
       + '<span class="cqb-pct">' + p + '%</span></div>';

/* ── 作答判定 ───────────────────────────────────────── */
window.mgAnswer = function(i){
  if(MG.answered) return;
  var x = MG.cur, q = MG.order[MG.idx], correct, ansIdx;
  /* ★ v1.1.0 — drag(拖放分類)與 sort 用同一份 bins 資料格式,判定共用這一條分支。
     ⚠ 不要為 drag 另寫一套:兩者的正解都是「q.b 這個籃子 id 排在第幾個」,
       各寫一份日後改資料格式一定會漏掉其中一邊。 */
  if(x.engine === 'sort' || x.engine === 'drag'){
    var ci = -1, k;
    for(k = 0; k < x.bins.length; k++){ if(x.bins[k].id === q.b) ci = k; }
    ansIdx = ci;
  }else{
    ansIdx = q.a;
  }
  correct = (i === ansIdx);
  finishAnswer(correct, ansIdx, q);
};
window.mgAnswerMap = function(spotId){
  if(MG.answered) return;
  var q = MG.order[MG.idx];
  var correct = (spotId === q.a);
  MG.answered = true; stopTimer();
  var el = $('sp-' + spotId);
  if(el) el.setAttribute('class', 'spot ' + (correct ? 'ok' : 'ng'));
  if(!correct){
    var right = $('sp-' + q.a);
    if(right) right.setAttribute('class', 'spot reveal');
  }
  scoreIt(correct);
  showFeedback(correct, correct ? '✅ 答對了!' : '❌ 正確位置已標出來', tx(q.why));
};

function finishAnswer(correct, ansIdx, q){
  MG.answered = true;
  stopTimer();
  /* ★ v1.1.0 — drag 沒有 .opt 按鈕,要染的是籃子(答對綠、答錯把正解籃染綠) */
  if(MG.cur && MG.cur.engine === 'drag') lockBins(ansIdx);
  else lockOptions(ansIdx, correct ? ansIdx : -2);
  scoreIt(correct);
  showFeedback(correct, correct ? '✅ 答對了!' : '❌ 再想想看', q.why ? tx(q.why) : '');
}
function lockOptions(ansIdx, _sel){
  var btns = $('opts').getElementsByTagName('button'), i, di;
  for(i = 0; i < btns.length; i++){
    btns[i].disabled = true;
    di = parseInt(btns[i].getAttribute('data-i'), 10);
    if(di === ansIdx) btns[i].className = 'opt ok';
  }
}
/* ★ v1.1.0 — 拖放分類作答後:正解籃子染綠、其餘鎖住不能再拖 */
function lockBins(ansIdx){
  var bins = $('drag-bins').getElementsByClassName('dbin'), i;
  for(i = 0; i < bins.length; i++){
    bins[i].className = 'dbin' + (i === ansIdx ? ' ok' : '');
  }

}

function scoreIt(correct){
  if(correct){
    MG.right++;
    MG.combo++;
    if(MG.combo > MG.maxCombo) MG.maxCombo = MG.combo;
    var bonus = Math.min(MG.combo - 1, 5) * 20;
    var timeB = Math.round(MG.tleft * 2);
    MG.score += 100 + bonus + timeB;
    playSfx('sfx-ok', 0.5);   /* ★ v1.3.1 老師:「答對音效要統一」—— 原連擊 ≥3 改播 coin,現在一律 sfx-ok(連擊仍有 combo 特效與加分) */
    /* ★ v1.3.0 — 答對特效:光暈亮星打在作答區中央 + 分數飄字;連擊 ≥3 再加點擊星星 */
    var _c = mgCenterOf(mgActiveBox());
    mgFx('hit', _c.x, _c.y, 220, 900);
    if(MG.combo >= 3) mgFx('combo', _c.x + 90, _c.y - 60, 150, 1000);
    if(MG.combo >= 5) mgFxFull('focus', 650);      /* 連擊 ≥5:全畫面集中線 */
    mgScoreFloat('+' + (100 + bonus + timeB));
  }else{
    MG.combo = 0;
    playSfx('sfx-ng', 0.4);
    /* ★ v1.3.0 — 答錯:題卡左右抖一下(class 動畫,動畫結束自己拿掉,重複答錯還能再抖) */
    try{
      var _qc = $('qcard');
      if(_qc){ _qc.classList.remove('shake'); void _qc.offsetWidth; _qc.classList.add('shake'); }
      var _cw = mgCenterOf(mgActiveBox());
      mgFx('dizzy', _cw.x, _cw.y - 20, 150, 1100);   /* 暈眩星星 */
    }catch(e){}
  }
  $('score').textContent = MG.score + ' 分';
  $('combo').textContent = MG.combo >= 2 ? ('🔥 ' + MG.combo + ' 連') : '';
}
function showFeedback(ok, head, why){
  var f = $('feedback');
  f.className = 'feedback show ' + (ok ? 'ok' : 'ng');
  f.classList.add('show');

/* ── 結算 ───────────────────────────────────────────── */
function finishGame(){
  stopTimer();
  stopEngines();          /* ★ v1.1.0 必要:見 stopEngines 註解 */
  mgPauseReset(); hide('pause-btn');   /* ★ v1.4.0 */
  var total = MG.order.length;
  var acc = Math.round((MG.right / total) * 100);
  var stars = acc >= 90 ? 3 : (acc >= 70 ? 2 : (acc >= 50 ? 1 : 0));
  /* ★ v1.4.0(老師需求③)— 用時加成:本局牆鐘用時(含暫停)越短,最後得分加成越高(最多 +50%)。
     ⚠ 只在有答對時才加成(0 分乘什麼都是 0,也避免全錯還拿加成的怪象)。 */
  var _elapsed = mgElapsedSec(), _par = mgParTime(MG.cur);
  var _bonusPct = (MG.right > 0) ? mgTimeBonusPct(_elapsed, _par) : 0;
  var _base = MG.score;
  MG.score = Math.round(_base * (1 + _bonusPct / 100));
  MG.elapsed = Math.round(_elapsed);
  hide('page-play'); show('page-result');
  show('toapp-btn');
  bgmPlay('bgm-result', 0.42, true);   /* 不 loop,播一次就好 */

  $('r-name').textContent = MG.cur.icon + ' ' + tx(MG.cur.name);
  /* ★ v1.3.0 — 三顆星逐顆彈出(拿到的亮、沒拿到的暗淡留位),金色光圈 gif 墊在後面 */
  var _sh = '', _k;
  for(_k = 1; _k <= 3; _k++) _sh += '<span class="' + (_k <= stars ? '' : 'dim') + '">★</span>';
  $('r-stars').innerHTML = _sh;
  (function(){
    var sp = $('r-stars').getElementsByTagName('span'), i;
    for(i = 0; i < stars && i < sp.length; i++){
      (function(el, delay){
        setTimeout(function(){ el.classList.add('lit'); playSfx('sfx-sel', 0.35); }, delay);
      })(sp[i], 350 + i * 380);
    }
  })();
  var _tr = $('r-trophy');
  if(_tr){
    _tr.classList.remove('on'); _tr.style.display = '';
    if(stars > 0){ _tr.src = MG_TROPHY[stars]; setTimeout(function(){ _tr.classList.add('on'); }, 350 + stars * 380); }
    else{ _tr.removeAttribute('src'); _tr.style.display = 'none'; }
  }
  if(stars === 3){
    setTimeout(function(){ var c = mgCenterOf('r-trophy'); mgFx('clap', c.x, c.y + 40, 260, 1800); playSfx('sfx-clap', 0.45); }, 1600);
  }
  var _gl = $('r-glow');
  if(_gl){
    _gl.classList.remove('on');
    _gl.src = MG_FX.glow + '?v=' + MG_VER + '&t=' + Date.now();
    setTimeout(function(){ _gl.classList.add('on'); }, 250);
  }
  $('r-score').textContent = MG.score + ' 分';
  $('r-detail').textContent = '答對 ' + MG.right + ' / ' + total
                            + ' 題(' + acc + '%) · 最高連擊 ' + MG.maxCombo;
  /* ★ v1.4.0 用時列(雙版) */
  var _rt = $('r-time');
  if(_rt){
    _rt.innerHTML = '⏱ ' + (MG.style === 's' ? '用了 ' : '本局用時 ') + '<b>' + mgFmtTime(_elapsed) + '</b>'
      + (_bonusPct > 0
          ? ('　· ' + (MG.style === 's' ? '快手加成' : '快手加成(含暫停時間)') + ' <b>+' + _bonusPct + '%</b>(' + _base + ' → ' + MG.score + ')')
          : ('　· ' + (MG.style === 's' ? '再快一點就有加成!' : '用時未達加成門檻(標準 ' + mgFmtTime(_par) + ')')));
  }

  var prev = MG.best[MG.cur.id];
  var isNew = (!prev || MG.score > prev.score);
  if(isNew){
    MG.best[MG.cur.id] = { score: MG.score, stars: stars, acc: acc, time: MG.elapsed };   /* ★ v1.4.0 成績含用時 */
    show('r-newbest');
    playSfx('sfx-clap', 0.5);
    /* ★ v1.3.0 — 新紀錄:彩色星星從結算卡左右兩側各噴一次 */
    setTimeout(function(){
      var c = mgCenterOf('r-score');
      mgFx('best', c.x - 150, c.y - 40, 200, 1500);
      mgFx('best', c.x + 150, c.y - 40, 200, 1500);
    }, 900);
  }else{
    hide('r-newbest');
    playSfx('sfx-coin', 0.4);
  }

  if(MG.user && isNew){
    $('r-cloud').textContent = '☁ 存到雲端中…';
    saveCloud(MG.cur.id, MG.best[MG.cur.id]);
  }else if(MG.user){
    $('r-cloud').textContent = '☁ 這次沒有超過最佳成績,雲端保持原紀錄';
  }else{
    $('r-cloud').textContent = '目前沒有登入,成績只留在這一次(關掉就不見)';
  }
  window.scrollTo(0, 0);
}

var FB_BASE = 'https://www.gstatic.com/firebasejs/10.12.0/';

function loadScript(url){
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = url; s.async = true;
    s.onload = function(){ res(); };
    s.onerror = function(){ rej(new Error('load fail: ' + url)); };
    document.head.appendChild(s);
  });
}
function ensureFirebase(){
  if(MG.fb) return Promise.resolve(MG.fb);
  if(MG.fbLoading) return Promise.reject(new Error('loading'));
  MG.fbLoading = true;
  toast('連線中,請稍等…');
  return loadScript(FB_BASE + 'firebase-app-compat.js')
    .then(function(){ return loadScript(FB_BASE + 'firebase-auth-compat.js'); })
    .then(function(){ return loadScript(FB_BASE + 'firebase-firestore-compat.js'); })
    .then(function(){
      var app = window.firebase.initializeApp(FB_CFG, 'minigame');
      var auth = window.firebase.auth(app);
      var db = window.firebase.firestore(app);
      MG.fb = { app: app, auth: auth, db: db };
      MG.fbLoading = false;
      try{ auth.setPersistence(window.firebase.auth.Auth.Persistence.SESSION); }catch(e){}
      auth.onAuthStateChanged(function(u){ onUser(u); });
      return MG.fb;
    })['catch'](function(e){
      MG.fbLoading = false;
      toast('連線失敗,不過不影響玩遊戲');
      throw e;
    });
}

function loadCloud(){
  if(!MG.fb || !MG.user) return;
  MG.fb.db.collection('minigameScores').doc(MG.user.uid).get().then(function(snap){
    if(!snap.exists) return;
    var d = snap.data() || {}, g = d.games || {}, k;
    // ★ 合併規則:兩邊取「分數較高者」,絕不用雲端的低分覆蓋本機剛打出的高分
    for(k in g){
      if(!g.hasOwnProperty(k)) continue;
      if(!MG.best[k] || (g[k] && g[k].score > MG.best[k].score)) MG.best[k] = g[k];
    }
    renderGrid();
    toast('已讀取雲端最佳成績');
  })['catch'](function(){ /* 讀不到就算了,不影響遊玩 */ });
}
function saveCloud(gid, rec){
  if(!MG.fb || !MG.user) return;
  var payload = { uid: MG.user.uid, name: (MG.user.displayName || ''), games: {} };
  payload.games[gid] = {
    score: rec.score, stars: rec.stars, acc: rec.acc, at: Date.now(),
    time: (typeof rec.time === 'number') ? rec.time : 0   /* ★ v1.4.0 成績含用時(秒) */
  };
  MG.fb.db.collection('minigameScores').doc(MG.user.uid)
    .set(payload, { merge: true })
    .then(function(){ $('r-cloud').textContent = '☁ 已存到雲端'; })
    ['catch'](function(){ $('r-cloud').textContent = '☁ 雲端存檔失敗(成績仍保留在這次遊戲中)'; });
}

/* ══════════════════════════════════════════════════════════
 *  開機
 * ══════════════════════════════════════════════════════════ */
function boot(){
  try{
    var st = localStorage.getItem('mg_style');
    if(st === 's' || st === 'f') MG.style = st;
  }catch(e){}
  /* ★ v1.1.0 — BGM 偏好(只存本機,不上雲;與 mg_style 同層) */
  _mgVolLoad();        /* ★ v1.4.0 音樂/音效音量(含舊 mg_bgm 一次性遷移) */
  _mgVolBtnSync();
  try{ $('style-btn').textContent = (MG.style === 'f' ? '字多' : '字少'); }catch(e){}   /* ★ v1.3.0 開機依記住的模式顯示 字少／字多 */
  /* iOS 自動播放封鎖:第一次觸碰畫面才解得開(一次性,{once:true} 舊 Safari 不支援 ⇒ 自己移除) */
  var _armOnce = function(){
    _bgmArm();
    document.removeEventListener('touchstart', _armOnce, true);
    document.removeEventListener('mousedown', _armOnce, true);
  };
  document.addEventListener('touchstart', _armOnce, true);
  document.addEventListener('mousedown', _armOnce, true);

  if(!window.MG_GAMES || !window.MG_GAMES.length){
    document.getElementById('grid').innerHTML =
      '<p style="grid-column:1/-1;text-align:center;opacity:.8;">'
      + '資料載入失敗,請重新整理頁面。</p>';
    return;
  }
  MG.games = window.MG_GAMES;
  renderGrid();
  mgCfgLoad();   /* ★ v1.3.0 各關開／關設定(快取先畫、雲端到了重畫) */
  /* ★ v1.1.0 — 測試期閘門:非管理員停在預告頁(單一收口點 applyGate) */
  applyGate();
  if(mgUnlocked()) bgmPlay('bgm-home');

  // 若上次用 redirect 登入,回來時把結果接起來(不主動載 SDK)
  if(window.firebase && MG.fb){
    try{ MG.fb.auth.getRedirectResult(); }catch(e){}
  }

  // Service Worker(只註冊本目錄,scope 比主程式更具體)
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js?v=' + MG_VER)['catch'](function(){});
    });
  }
  console.log('[小英雄小遊戲]', MG_VER, '共', MG.games.length, '款');

  /* ★ v1.1.1 — 字重自檢(只在 console 提示,不影響遊戲)。
     「字糊成一團」的真兇是**合成粗體**:當 CSS 要求的字重字型沒有實體字面時,
     瀏覽器會自己把字往旁邊描一次來假裝變粗,筆畫多的繁體字就黏成一坨。
     本專案字型鏈為 M PLUS Rounded 1c(400/700/800/900)→ Noto Serif TC(400/700/900)→ 系統中文字,
     取**交集** 400/700/900 才能保證不管缺字 fallback 到哪一支都不會合成粗體。
     這種問題在 code review 時很難用眼睛看出來,所以讓程式自己抓。 */
  try{
    /* ★ v1.3.0 — 允許清單改 400/700:霞鶩文楷 TC 只有 300/400/700,900 會合成粗體 */
    var _OKW = { '400':1, '700':1, 'normal':1, 'bold':1, 'inherit':1, '':1 };
    var _els = document.getElementsByTagName('*'), _bad = {}, _i, _w;
    for(_i = 0; _i < _els.length; _i++){
      _w = '';
      try{ _w = window.getComputedStyle(_els[_i]).fontWeight || ''; }catch(_e){}
      if(_w && !_OKW[String(_w)]) _bad[_w] = (_bad[_w] || 0) + 1;
    }
    for(_w in _bad){
      if(_bad.hasOwnProperty(_w))
        console.warn('[字重自檢] ⚠ font-weight:' + _w + ' 有 ' + _bad[_w] + ' 個元素在用,'
                   + '但字型鏈中有字型沒有這一級 ⇒ 缺字 fallback 時會合成粗體(字會糊)。'
                   + '請改用 400 / 700 / 900。');
    }
  }catch(_e){}
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
}else{
  boot();
}

})();
</script>
</body>
</html>
