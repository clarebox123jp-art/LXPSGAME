<!-- ============================================================================
     小英雄小遊戲 — 獨立 PWA(minigame/index.html)v1.5.0(2026-09-05)
     ★ v1.5.0:橫式滿版兩欄版面(iPad/PC/手機橫式皆鎖一個視窗高)、解說圖 contain 不裁切+圖文放大、地圖放大+圓點加大、
       右上 ⛶ 全螢幕(同主程式設計)、觸控直式強制橫式遮罩、回收大隊拖曳卡去底、「下一題」固定右下(iOS 安全區)
     ★ v1.4.1:算數大進擊 對錯算式同色同圖(不洩題)+ 掉落速度 ×0.5
     ★ v1.4.0(老師四點):①聽音坊新引擎 song/play/score/rhythm(動物琴鍵 唱名＋音名 可勾選隱藏、拍子鼓、WebAudio 鋼琴/鼓音色)
       ②算數大進擊:砲台射擊光彈、hard 條目金框發光×2、誤擊爆炸炸掉半徑內掉落物(煙霧爆開.gif)
       ③右上 ⏸ 暫停(倒數/掉落/BGM 停住;本局用時=牆鐘含暫停)+ 結算快手加成(≤30% 標準時間 +50%)+ 成績含 time
       ④🎵/🔊 音量拉桿面板(同主程式設計;mg_vol_bgm/mg_vol_sfx;舊 mg_bgm 一次性遷移)
     ★ v1.3.1:答對一律 sfx-ok(答對.mp3)、答錯一律 sfx-ng(答錯音效.mp3),十個引擎全走同一組;scoreIt 連擊不再改播 coin、迷宮踩錯不再 explode
     ★ v1.3.0(老師裁定 1甲 2丙 3甲):每款專屬 BGM + 整頁場景背景 + 題卡橫幅 + 答對/結算特效
       + 介面精緻化 + iPad 斷點放大;「九格小學堂」更名「小學堂」。細節見 CSS 檔尾 v1.3.0 區塊與各函式註記。
     ★ 與主程式 index.html 完全分離:不引用主程式任何 JS/CSS/全域變數/localStorage 鍵。
     ★ 存在目的(老師需求):平板老舊、校網太差而開不動「小英雄大對抗」的學生,
       至少能秒開這個小程式來玩 ⇒ 首載只有本檔 + minigame_db.js,無框架、無外部字型。
     ★ Firebase SDK 只在按「登入」時才動態載入(compat 版),不登入完全不碰網路。
     ★ 全 ES5:沒有 ?. ?? 箭頭函式 樣板字串 let/const,舊 iPad Safari 直接跑。
     ★ 共用平板:未登入的成績只留在記憶體(關掉就沒了);登入使用獨立 app 名稱 +
       SESSION persistence ⇒ 讀不到主程式殘留 token、關 App 即忘。
     ★ 雲端:同一個 Firebase 專案 lxpsgame、同一個 Google 帳號 ⇒ uid 相同,
       只寫 minigameScores/{uid},絕不碰 players/ 存檔。
     ★ 鐵律 1.232:所有解說文字都有 簡單風(s)/精緻風(f) 兩版,右上角「字」鈕即時切換。
     ============================================================================ -->
<style>
/* ★ v1.2.0(老師:「面板、字體都用小英雄大作戰現有的就可以了,不要自己另外生新的」)
   ⚠ 這裡的值**逐一對應主程式 main.css 的 :root**,不是另外調的顏色。
     舊版(v1.0.0~v1.1.2)我自己配了一套「深綠茶山」色系,與主程式的深藍黑+金色對不起來,
     學生從大作戰點進小遊戲會覺得是另一個 App —— 那正是老師要修的問題。
   ★ 變數名沿用小遊戲原本的(--ink/--tea/--mist…),只換「值」:
     這樣全檔一百多處 var(...) 一行都不必動,改這一段就整站換色,也不會漏改。
   ★ 對應關係(左=小遊戲變數,右=主程式 main.css 的來源):
       --ink   ← --bg     #08090d   --ink2 ← --panel  #0e1018
       --tea   ← --panel2 #141720   --mist ← --text   #e8e4d8
       --sun   ← --gold   #d4a843   --gold ← --gold2  #f0c060
       --brick ← --red    #e84040   --grass← --green  #3ec87a
       --line  ← --border #2a2d3a   --muted← --muted  #7a7a8a */
:root{
  --ink:#08090d;        /* 主程式 --bg     底色 */
  --ink2:#0e1018;       /* 主程式 --panel  面板 */
  --tea:#141720;        /* 主程式 --panel2 次面板 */
  --mist:#e8e4d8;       /* 主程式 --text   主文字 */
  --paper:#e8e4d8;      /* 淺底卡片(拖曳卡/選項)用主文字色當紙色,與主程式同一支米白 */
  --sun:#d4a843;        /* 主程式 --gold   主要行動 */
  --gold:#f0c060;       /* 主程式 --gold2  星星/強調 */
  --brick:#e84040;      /* 主程式 --red    錯誤 */
  --grass:#3ec87a;      /* 主程式 --green  正確 */
  --line:#2a2d3a;       /* 主程式 --border 框線 */
  --muted:#7a7a8a;      /* 主程式 --muted  次要文字 */
  --shadow:0 6px 0 rgba(0,0,0,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  background:var(--ink);
  background-image:
    radial-gradient(circle at 20% 0%,rgba(79,191,125,.13),transparent 55%),
    radial-gradient(circle at 85% 12%,rgba(242,168,60,.10),transparent 50%);
  color:var(--mist);
  /* ★ v1.2.1(老師:「小遊戲字體一律用中文圓體」)
     ⚠ 實查結論:**Google Fonts 上沒有免費的繁體中文圓體**。
       繁中只有 明體(Noto Serif TC)／黑體(Noto Sans TC)／楷體(LXGW WenKai TC),就是沒有圓體。
       所以「中文圓體」目前最接近的解 = M PLUS Rounded 1c ——
       它是日文圓體,但漢字集涵蓋絕大多數常用繁體字,而且**正是主程式封面在用的那支**,
       老師看到的「小英雄小遊戲」標題字、封面按鈕字,就是這個圓潤的觀感。
     ★ 順序:圓體打頭 → 缺字時交給繁中系統字(iPad=PingFang TC / Windows=微軟正黑體)。
       少數台灣特有字(如「臺」的異體)會由系統字接手,字形會略有差異 —— 主程式現況亦同。
     ⚠ v1.2.0 曾把 Noto Serif TC(明體)排第一以求「純中文」,但那是襯線明體、不是圓體,
       與老師要的觀感不符,本版改回圓體優先;Noto Serif TC 留在後面當中文備援。
     ⚠⚠ 字重連帶:M PLUS Rounded 1c 有 400/700/800/900 四級,可以用 800;
       但備援的 Noto Serif TC **沒有 800** ⇒ 為了「不管走到哪一支都不會合成粗體」,
       全檔字重一律只用 **400 / 700 / 900**(三支字型的交集),不要用 800。開機自檢會抓。 */
  /* ★ v1.3.0(老師 2026-09-05 兩次裁定:「換成繁體中文字體」→「改霞鶩文楷 TC」)
     字型=**LXGW WenKai TC(霞鶩文楷・繁體楷體,免費開源)**,備援=系統繁中字(iPad PingFang TC／Windows 微軟正黑體)。
     ⚠⚠ 字重連帶:霞鶩文楷只有 300/400/700 **沒有 900** ⇒ 全檔 font-weight:700 一律改 700,
        開機自檢允許清單改為 400/700(用到 900 會被抓)。
     上面 v1.2.1 的圓體說明保留備查。 */
  font-family:"LXGW WenKai TC","PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;
  font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
.wrap{max-width:820px;margin:0 auto;padding:10px 14px 40px;}
button,.btn{
  font-family:inherit;font-size:18px;font-weight:700;color:#3a2a10;
  background:var(--sun);border:0;border-radius:14px;
  padding:13px 18px;min-height:48px;cursor:pointer;
  box-shadow:var(--shadow);touch-action:manipulation;
}
button:active,.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.28);}
button[disabled]{opacity:.45;}
.btn-ghost{background:transparent;color:var(--mist);border:2px solid rgba(232,228,216,.35);box-shadow:none;}
.btn-ghost:active{transform:translateY(2px);}
.hidden{display:none !important;}

/* ── 頂列 ───────────────────────────────── */
#topbar{display:flex;align-items:center;gap:8px;padding:6px 2px 2px;min-height:46px;}
#topbar .grow{flex:1;}
.chip{
  font-size:14px;font-weight:700;padding:7px 12px;border-radius:999px;min-height:38px;
  background:rgba(255,255,255,.10);color:var(--mist);border:1px solid rgba(232,228,216,.22);
  box-shadow:none;
}
#who{font-size:14px;opacity:.9;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── 首頁 ───────────────────────────────── */
#title-img{display:block;width:100%;max-width:560px;margin:2px auto 0;}
#title-fallback{display:none;text-align:center;font-size:32px;font-weight:700;color:var(--gold);margin:10px 0;letter-spacing:1px;}
.sub{text-align:center;font-size:15px;opacity:.85;margin:0 0 14px;}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.cell{
  position:relative;background:linear-gradient(180deg,var(--ink2),var(--tea));
  border:2px solid rgba(232,228,216,.16);border-radius:18px;
  padding:12px 6px 10px;text-align:center;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.3);touch-action:manipulation;min-height:250px;
  /* ★ v1.1.0 — 加了縮圖之後改「上對齊」:置中會讓縮圖跟著卡片高度浮動,
     每張卡的圖高低不一,九宮格看起來就歪掉了。 */
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;
}
.cell:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3);}
/* ── v1.1.0 選單卡改版(需求1 代表縮圖+大字名稱／需求4 難度+核心能力)── */
.cthumb{
  position:relative;width:100%;height:96px;border-radius:12px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(0,0,0,.25));
  display:flex;align-items:center;justify-content:center;margin-bottom:8px;
}
.cthumb img{
  width:100%;height:100%;object-fit:cover;display:block;
  /* 場景圖偏亮,壓暗一點才襯得住上面的白字 */
  filter:brightness(.82) saturate(1.05);
}
/* emoji 墊在圖底下:圖沒載到時由 mgThumbFail 把它顯出來 */
.cthumb-emo{position:absolute;font-size:38px;line-height:1;opacity:0;}
.cell .ce{font-size:34px;line-height:1.1;}
.cskills{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:5px;}
.cskill{
  font-size:12px;font-weight:700;padding:2px 8px;border-radius:9px;
  background:rgba(79,191,125,.22);border:1px solid rgba(127,216,160,.45);
  color:var(--grass);letter-spacing:.3px;
}
.cdiff{font-size:13px;color:var(--gold);letter-spacing:1px;margin-top:4px;opacity:.9;}
/* ★ v1.1.1 — 載入 M PLUS Rounded 1c 之後,800 是真實字面(不再是合成粗體)⇒ 調回 800,
   字級再加大到 19px,對齊主程式封面按鈕那種清晰有力的觀感。
   ⚠ 只能用字型有的字重:400/700/800/900。 */
.cell .cn{font-size:19px;font-weight:700;color:var(--mist);letter-spacing:.5px;line-height:1.35;}
.cell .cs{font-size:13px;opacity:.75;letter-spacing:.5px;}
.cell .cstar{font-size:14px;color:var(--gold);min-height:18px;letter-spacing:2px;}
.cell .cbest{position:absolute;top:6px;right:8px;font-size:13px;opacity:.8;font-weight:700;}

/* ── 測試期閘門頁(v1.1.0)──────────────── */
#gate-title{display:block;width:100%;max-width:460px;margin:6px auto 0;opacity:.9;}
#gate-card{
  background:linear-gradient(180deg,var(--ink2),var(--tea));
  border:2px solid rgba(242,168,60,.35);border-radius:22px;
  padding:22px 18px 20px;text-align:center;margin:14px auto 0;max-width:560px;
  box-shadow:0 6px 0 rgba(0,0,0,.3);
}
#gate-card .gate-emo{font-size:54px;line-height:1;}
#gate-card h2{font-size:26px;font-weight:700;color:var(--gold);margin:8px 0 10px;letter-spacing:1px;}
#gate-card p{font-size:17px;line-height:1.8;margin:0 0 6px;}
#gate-note{font-size:14px;opacity:.6;margin-top:14px !important;}
.gate-row{display:flex;gap:10px;margin-top:14px;justify-content:center;}
.gate-row .btn,.gate-row button{flex:1;max-width:260px;text-decoration:none;
  display:flex;align-items:center;justify-content:center;}
/* 預告用的九款縮圖(只給看,不能點)—— 讓學生知道「快好了」而不是「壞掉了」 */
#gate-preview{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0 4px;}
#gate-preview span{
  font-size:26px;line-height:1;padding:10px 0;border-radius:12px;
  background:rgba(255,255,255,.07);border:1px solid rgba(232,228,216,.14);
  filter:grayscale(1);opacity:.62;
}

/* ── 遊戲畫面 ───────────────────────────── */
#hud{display:flex;align-items:center;gap:10px;margin:6px 0 10px;flex-wrap:wrap;}
.stat{background:rgba(255,255,255,.09);border-radius:12px;padding:6px 12px;font-size:15px;font-weight:700;}
#combo{color:var(--gold);}
#timebar-wrap{height:10px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin-bottom:12px;}
#timebar{height:100%;width:100%;background:linear-gradient(90deg,var(--grass),var(--gold));transition:width .25s linear;}
#timebar.low{background:linear-gradient(90deg,var(--brick),var(--sun));}

.card{
  background:var(--paper);color:#2b2b2b;border-radius:18px;padding:18px 16px;
  font-size:20px;line-height:1.7;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.25);
  min-height:96px;display:flex;align-items:center;justify-content:center;text-align:center;
}
#qhint{font-size:14px;text-align:center;opacity:.85;margin:8px 0 0;}
.opts{display:grid;gap:10px;margin-top:14px;}
.opts.two{grid-template-columns:1fr 1fr;}
.opts.three{grid-template-columns:repeat(3,1fr);}
.opt{
  background:var(--ink2);color:var(--mist);border:2px solid rgba(232,228,216,.25);
  border-radius:16px;padding:14px 10px;font-size:17px;font-weight:700;min-height:58px;
  box-shadow:0 4px 0 rgba(0,0,0,.28);
}
.opt .oe{display:block;font-size:26px;line-height:1.2;}
.opt.ok{background:var(--grass);color:#0d2a18;border-color:var(--grass);}
.opt.ng{background:var(--brick);color:#fff;border-color:var(--brick);}
#feedback{
  margin-top:14px;border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.7;
  background:rgba(255,255,255,.10);border-left:6px solid var(--gold);display:none;
}
#feedback.show{display:block;}
#feedback b{color:var(--gold);}
#feedback.ok{border-left-color:var(--grass);}
#feedback.ng{border-left-color:var(--brick);}
#nextrow{display:flex;gap:10px;margin-top:14px;}
#nextrow button{flex:1;}

/* ── 地圖引擎 ───────────────────────────── */
#mapbox{background:rgba(255,255,255,.06);border-radius:18px;padding:8px;margin-top:12px;}
#tw-svg{display:block;width:100%;height:auto;max-height:56vh;}
.spot{fill:rgba(232,228,216,.30);stroke:rgba(255,255,255,.5);stroke-width:.7;cursor:pointer;}
.spot.ok{fill:var(--grass);}
.spot.ng{fill:var(--brick);}
.spot.reveal{fill:var(--gold);stroke:#fff;stroke-width:1.4;}
.spotlbl{font-size:4.6px;fill:var(--mist);pointer-events:none;text-anchor:middle;font-weight:700;}

/* ── 聽音引擎 ───────────────────────────── */
#playbtn{display:block;margin:14px auto 0;font-size:20px;padding:16px 34px;}
#playnote{text-align:center;font-size:14px;opacity:.8;margin-top:8px;}

/* ══ v1.1.0 新增六個引擎的樣式(老師需求 4「不要又是只有選擇題」)══
   共同原則:
   - 觸控目標一律 ≥44px(對齊 Apple HIG 下限,小學生手指才按得到)
   - 一律 touch-action:none 或 manipulation,避免拖曳時整頁跟著捲
   - 顏色一律走最上面的 CSS 變數,不寫死色碼 */

/* ── 引擎 D:拖放分類 ─────────────────────── */
#dragbox{margin-top:10px;}
#drag-item{
  background:var(--paper);color:#2b2b2b;border-radius:18px;padding:16px 14px;
  font-size:21px;font-weight:700;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.25);
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  position:relative;z-index:5;
}
#drag-item.dragging{cursor:grabbing;box-shadow:0 10px 22px rgba(0,0,0,.45);opacity:.95;}
#drag-item .dgrip{display:block;font-size:13px;opacity:.55;font-weight:400;margin-top:2px;}
#drag-bins{display:grid;gap:10px;margin-top:16px;}
#drag-bins.two{grid-template-columns:1fr 1fr;}
#drag-bins.three{grid-template-columns:repeat(3,1fr);}
.dbin{
  background:var(--ink2);border:2px dashed rgba(232,228,216,.35);border-radius:16px;
  padding:16px 8px;text-align:center;font-size:16px;font-weight:700;min-height:96px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:background .15s,border-color .15s,transform .15s;
}
.dbin .be{font-size:30px;line-height:1.1;}
.dbin.hot{background:rgba(242,168,60,.28);border-color:var(--sun);transform:scale(1.05);}
.dbin.ok{background:var(--grass);color:#0d2a18;border-color:var(--grass);border-style:solid;}
.dbin.ng{background:var(--brick);color:#fff;border-color:var(--brick);border-style:solid;}

/* ── 引擎 E:順序排列 ─────────────────────── */
#orderbox{margin-top:10px;}
#order-slots{display:flex;gap:8px;margin-bottom:14px;min-height:64px;}
.oslot{
  flex:1;border:2px dashed rgba(232,228,216,.3);border-radius:14px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:15px;font-weight:700;padding:8px 4px;min-height:64px;
  background:rgba(255,255,255,.05);
}
.oslot.filled{border-style:solid;background:var(--ink2);border-color:rgba(232,228,216,.5);}
.oslot .onum{position:absolute;font-size:11px;opacity:.5;}
#order-pool{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ocard{
  background:var(--paper);color:#2b2b2b;border:0;border-radius:14px;
  padding:14px 10px;font-size:17px;font-weight:700;min-height:56px;
  box-shadow:0 4px 0 rgba(0,0,0,.25);
}
.ocard.used{opacity:.25;pointer-events:none;}
#order-act{display:flex;gap:10px;margin-top:14px;}
#order-act button{flex:1;}

/* ── 引擎 F:翻牌配對 ─────────────────────── */
#matchbox{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
.mcard{
  position:relative;min-height:74px;border-radius:14px;border:2px solid rgba(232,228,216,.22);
  background:linear-gradient(180deg,var(--ink2),var(--tea));
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:14px;font-weight:700;padding:6px 4px;line-height:1.35;
  color:transparent;box-shadow:0 4px 0 rgba(0,0,0,.28);
  touch-action:manipulation;overflow:hidden;
}
.mcard::after{content:'🀄';position:absolute;font-size:30px;color:var(--mist);opacity:.5;}
.mcard.open,.mcard.done{color:var(--mist);background:var(--tea);}
.mcard.open::after,.mcard.done::after{display:none;}
.mcard.done{background:var(--grass);color:#0d2a18;border-color:var(--grass);opacity:.75;}
.mcard.miss{background:var(--brick);color:#fff;}

/* ── 引擎 G:反應點擊(老師指定 A)────────────
   天上掉下許多候選答案,點對加分、點錯扣分。 */
#reactbox{
  position:relative;height:56vh;min-height:300px;margin-top:10px;
  border-radius:18px;overflow:hidden;
  background:
    radial-gradient(circle at 30% 8%,rgba(79,191,125,.14),transparent 60%),
    radial-gradient(circle at 78% 4%,rgba(242,168,60,.12),transparent 55%),
    rgba(255,255,255,.05);
  border:2px solid rgba(232,228,216,.14);
  touch-action:manipulation;
}
.rdrop{
  position:absolute;padding:9px 14px;border-radius:14px;
  font-size:17px;font-weight:700;white-space:nowrap;
  background:var(--paper);color:#2b2b2b;box-shadow:0 4px 10px rgba(0,0,0,.4);
  will-change:transform;min-height:44px;display:flex;align-items:center;
}
.rdrop.bad{background:#e8dff0;}
.rdrop.hit{background:var(--grass);color:#0d2a18;}
.rdrop.wrong{background:var(--brick);color:#fff;}
#react-hud{
  display:flex;justify-content:space-between;align-items:center;
  font-size:15px;font-weight:700;margin-top:8px;padding:0 4px;
}
.rfloat{
  position:absolute;font-size:20px;font-weight:700;pointer-events:none;
  animation:rfl .8s ease-out forwards;z-index:9;
}
@keyframes rfl{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-46px);}}

/* ── 引擎 H:走迷宮(老師指定 B)──────────────
   走過的地方不能再走,而且要經過正確答案。 */
#mazebox{margin-top:10px;}
#maze-grid{display:grid;gap:5px;justify-content:center;}
.mz{
  width:100%;aspect-ratio:1/1;border-radius:10px;
  background:rgba(255,255,255,.07);border:1px solid rgba(232,228,216,.14);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;line-height:1.2;text-align:center;
  padding:2px;overflow:hidden;touch-action:manipulation;
}
.mz.wall{background:rgba(0,0,0,.42);border-color:transparent;}
.mz.ans{background:rgba(242,168,60,.22);border-color:var(--sun);color:var(--gold);font-size:12px;}
.mz.bad{background:rgba(210,84,63,.18);border-color:rgba(210,84,63,.5);font-size:12px;}
.mz.walked{background:var(--tea);border-color:var(--tea);color:var(--mist);}
.mz.got{background:var(--grass);border-color:var(--grass);color:#0d2a18;}
.mz.here{outline:3px solid var(--gold);outline-offset:-3px;}
.mz.goal{background:rgba(255,209,102,.2);border-color:var(--gold);}
.mz.reach{box-shadow:inset 0 0 0 2px rgba(255,255,255,.45);}
#maze-info{font-size:15px;text-align:center;margin-top:10px;line-height:1.6;}
#maze-act{display:flex;gap:10px;margin-top:10px;}
#maze-act button{flex:1;}

/* ── 引擎 I:調色考驗(老師指定 C)────────────
   左邊彩色原圖,右邊同一張的黑白圖+顏料區,把顏色拖到正確格子上色。 */
#paintbox{margin-top:10px;}
#paint-stage{display:flex;gap:10px;align-items:flex-start;}
.pcol{flex:1;min-width:0;}
.pcol h4{font-size:14px;margin:0 0 6px;text-align:center;opacity:.85;font-weight:700;}
#paint-ref,#paint-work{
  position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;
  background:var(--ink);border:2px solid var(--line);
}
#paint-work{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:0;}
#paint-ref img{width:100%;height:100%;object-fit:cover;display:block;}
.pcell{
  position:relative;background-size:300% 400%;background-repeat:no-repeat;
  filter:grayscale(1) contrast(1.05);
  outline:1px solid rgba(255,255,255,.18);outline-offset:-1px;
  transition:filter .45s ease;touch-action:none;
}
.pcell.done{filter:none;}
.pcell.hot{outline:3px solid var(--sun);outline-offset:-3px;}
.pcell.err{animation:pshake .3s;}
@keyframes pshake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
#paint-palette{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:14px;}
.pchip{
  width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.35);
  box-shadow:0 4px 0 rgba(0,0,0,.3);touch-action:none;position:relative;
  display:flex;align-items:flex-end;justify-content:center;
}
.pchip span{
  font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);
  margin-bottom:-2px;pointer-events:none;
}
.pchip.picked{border-color:var(--gold);transform:scale(1.14);}
#paint-drag{
  position:fixed;width:46px;height:46px;border-radius:50%;pointer-events:none;
  z-index:120;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.5);display:none;
}
#paint-note{text-align:center;font-size:14px;opacity:.85;margin-top:10px;}

/* ── 結算 ───────────────────────────────── */
#result{text-align:center;padding-top:6px;}
#result .big{font-size:52px;font-weight:700;color:var(--gold);line-height:1.2;}
#result .stars{font-size:38px;letter-spacing:6px;color:var(--gold);margin:6px 0;}
#result .line{font-size:16px;opacity:.9;margin:4px 0;}
#result .newbest{color:var(--grass);font-weight:700;font-size:21px;margin-top:6px;letter-spacing:.5px;}

/* ── 說明彈窗 ───────────────────────────── */
#modal{
  position:fixed;inset:0;background:rgba(5,15,11,.82);z-index:80;
  display:none;align-items:center;justify-content:center;padding:18px;
}
#modal.show{display:flex;}
#modal .box{
  background:var(--ink2);border:2px solid rgba(232,228,216,.22);border-radius:20px;
  padding:20px 18px;max-width:520px;width:100%;max-height:82vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
#modal h3{margin:0 0 4px;font-size:21px;color:var(--gold);}
#modal .tag{font-size:13px;opacity:.75;margin-bottom:12px;}
#modal .sec{margin:12px 0;}
#modal .sec b{display:block;font-size:14px;color:var(--gold);margin-bottom:2px;font-weight:700;}  /* v1.3.0 明寫 700:<b> 預設 bolder 會被字重自檢抓到 */
#modal .row{display:flex;gap:10px;margin-top:16px;}
#modal .row button{flex:1;}

/* 提示條 */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:rgba(0,0,0,.86);color:#fff;padding:11px 18px;border-radius:999px;
  font-size:15px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;}

/* 小螢幕 */
@media (max-width:390px){
  body{font-size:16px;}
  /* ★ v1.1.0 — 小螢幕分支若不同步放大,手機上會退回「字糊在一起」的舊尺寸。
     min-height 一併加大,免得放大後的字把卡片撐爆。 */
  .cell{min-height:206px;padding:9px 4px;}
  .cell .ce{font-size:29px;}
  .cell .cn{font-size:16px;letter-spacing:.3px;}
  /* ★ v1.1.0 — 手機上縮圖降到 72px,否則三欄併排會把卡片撐得太高需要一直捲 */
  .cthumb{height:72px;margin-bottom:6px;}
  .cskill{font-size:11px;padding:1px 6px;}
  .cdiff{font-size:12px;}
  .card{font-size:17px;padding:15px 12px;}
  .opt{font-size:15px;padding:12px 6px;}
}

/* ══════════════════════════════════════════════════════════════
   ★ v1.3.0(老師裁定 1甲 2丙 3甲)— 畫面精緻化:整頁場景背景 + 題卡橫幅 + 特效 + iPad 放大
   ⚠ 這一段刻意放在檔尾:全部是「覆寫」既有規則,靠 cascade 順序生效,
     舊規則一行不刪(要回退只要整段拿掉)。
   ⚠ 顏色一律走最上面的 CSS 變數;字重只用 400/700/900(v1.2.1 鐵則)。
   ══════════════════════════════════════════════════════════════ */

/* ── 整頁場景背景(2丙:背景 + 橫幅都要)──
   固定在最底層、用該款的場景圖(jpg 瘦身版,與縮圖同一張 ⇒ 圖只下載一次)。
   ★ 壓暗 + 微模糊:字要能讀,場景只是「氣氛」不是主角。
   ★ 用 opacity 過渡而不是換 src 閃一下:換遊戲時淡出淡入,不會白一下。 */
#bgscene{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-size:cover;background-position:center 30%;background-repeat:no-repeat;
  opacity:0;transition:opacity .6s ease;
  filter:brightness(.42) saturate(1.1) blur(2px);
  transform:scale(1.04);            /* 模糊會露出邊緣 2px 白邊,放大一點點吃掉 */
}
#bgscene.on{opacity:1;}
/* 底部再壓一層漸層,讓下方按鈕區永遠有足夠對比 */
#bgscene::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(8,9,13,.15) 0%,rgba(8,9,13,.35) 55%,rgba(8,9,13,.78) 100%);
}
.wrap{position:relative;z-index:1;}
#toast,#modal,#paint-drag{z-index:120;}
#modal{z-index:110;}

/* ── 題卡上方的場景橫幅(2丙)──
   關卡圖 + 遊戲名 + 一句主題文字(story 雙版),讓學生知道「我在哪裡玩什麼」。 */
#scene-banner{
  position:relative;height:118px;border-radius:18px;overflow:hidden;
  margin:4px 0 10px;border:2px solid rgba(240,192,96,.45);
  box-shadow:0 6px 18px rgba(0,0,0,.45);background:var(--ink2);
}
#scene-banner img{
  width:100%;height:100%;object-fit:cover;display:block;
  filter:brightness(.72) saturate(1.05);
}
#scene-banner .sb-txt{
  position:absolute;left:0;right:0;bottom:0;padding:10px 14px 9px;
  background:linear-gradient(180deg,transparent,rgba(8,9,13,.88));
  text-align:left;
}
#scene-banner .sb-name{
  font-size:22px;font-weight:700;color:var(--gold);letter-spacing:1px;line-height:1.2;
  text-shadow:0 2px 6px rgba(0,0,0,.9);
}
#scene-banner .sb-story{
  font-size:14px;opacity:.92;line-height:1.5;margin-top:2px;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}

/* ── 首頁:標題區與選單卡精緻化 ── */
#page-home .sub{font-size:17px;color:var(--gold);letter-spacing:2px;opacity:.95;font-weight:700;}
#grid{gap:12px;}
.cell{
  border:2px solid rgba(240,192,96,.28);
  background:linear-gradient(180deg,rgba(14,16,24,.92),rgba(20,23,32,.92));
  box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.4),0 10px 24px rgba(0,0,0,.35);
  transition:transform .12s,box-shadow .12s,border-color .12s;
}
.cell:active{border-color:var(--gold);box-shadow:0 1px 0 rgba(0,0,0,.35),0 0 18px rgba(240,192,96,.35);}
.cthumb{height:120px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.cthumb img{filter:brightness(.9) saturate(1.1);}
.cthumb-emo{font-size:46px;}
.cell .cn{font-size:20px;}
.cell .cbest{
  top:8px;right:9px;background:rgba(8,9,13,.78);color:var(--gold);
  padding:3px 9px;border-radius:999px;border:1px solid rgba(240,192,96,.5);font-size:13px;
}
.cell .cstar{font-size:16px;text-shadow:0 0 8px rgba(240,192,96,.6);}

/* ── 遊戲中 HUD:大字晶片 + 倒數環 ── */
#hud{gap:8px;margin:2px 0 8px;}
.stat{font-size:17px;padding:8px 14px;min-height:44px;display:inline-flex;align-items:center;
  border:1px solid rgba(232,228,216,.16);background:rgba(8,9,13,.62);}
.stat:empty{display:none;}   /* 連擊晶片沒字時不要留一顆空膠囊 */
/* 倒數環:conic-gradient 畫圓弧(iOS 12.2+ 支援;不支援時退回純圓底+數字,功能不變) */
#timering{
  width:52px;height:52px;border-radius:50%;flex:0 0 auto;
  background:rgba(8,9,13,.62);border:1px solid rgba(232,228,216,.16);
  display:flex;align-items:center;justify-content:center;position:relative;
}
#timering::before{
  content:'';position:absolute;inset:4px;border-radius:50%;background:var(--ink2);
}
#timering .tnum{position:relative;font-size:19px;font-weight:700;color:var(--mist);line-height:1;}
#timering.low .tnum{color:var(--brick);}
#timebar-wrap{height:12px;background:rgba(8,9,13,.6);border:1px solid rgba(232,228,216,.12);}

/* 題卡:加金框、稍微放大 */
.card{
  font-size:22px;border:3px solid rgba(240,192,96,.55);
  box-shadow:0 5px 0 rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.45);
}
.card.shake{animation:cshake .4s;}
@keyframes cshake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
.opt{background:rgba(14,16,24,.92);border-color:rgba(232,228,216,.3);}
.opt.ok{box-shadow:0 4px 0 rgba(0,0,0,.28),0 0 22px rgba(62,200,122,.55);}

/* 解說改成有標題列的卡片 */
#feedback{
  background:rgba(14,16,24,.92);border:2px solid rgba(232,228,216,.18);border-left-width:8px;
  padding:0;overflow:hidden;font-size:17px;box-shadow:0 8px 24px rgba(0,0,0,.4);
}
#feedback .fb-head{
  display:block;font-size:20px;font-weight:700;padding:10px 16px;
  background:rgba(255,255,255,.06);border-bottom:1px solid rgba(232,228,216,.12);
}
#feedback.ok .fb-head{color:var(--grass);}
#feedback.ng .fb-head{color:var(--brick);}
#feedback .fb-body{display:block;padding:12px 16px 14px;}
#feedback .fb-body:empty{display:none;}

/* 分數飄字(答對時從分數晶片飄上去) */
.scorefloat{
  position:fixed;z-index:115;pointer-events:none;
  font-size:26px;font-weight:700;color:var(--gold);
  text-shadow:0 2px 8px rgba(0,0,0,.9),0 0 14px rgba(240,192,96,.6);
  animation:sfl 1.1s ease-out forwards;
}
@keyframes sfl{0%{opacity:0;transform:translate(-50%,10px) scale(.7);}15%{opacity:1;transform:translate(-50%,0) scale(1.15);}100%{opacity:0;transform:translate(-50%,-70px) scale(1);}}
/* GIF 特效層(沿用主程式素材 光暈亮星／點擊星星／金色光圈／彩色星星) */
.fxgif{
  position:fixed;z-index:114;pointer-events:none;
  transform:translate(-50%,-50%);opacity:.95;
  animation:fxin .25s ease-out;
}
@keyframes fxin{from{opacity:0;transform:translate(-50%,-50%) scale(.5);}to{opacity:.95;transform:translate(-50%,-50%) scale(1);}}

/* ── 結算頁:獎狀風 ── */
#result{
  position:relative;margin-top:8px;padding:26px 18px 22px;border-radius:24px;
  background:linear-gradient(180deg,rgba(14,16,24,.9),rgba(20,23,32,.94));
  border:3px solid rgba(240,192,96,.6);
  box-shadow:0 0 0 6px rgba(8,9,13,.6),0 0 40px rgba(240,192,96,.25),0 14px 40px rgba(0,0,0,.5);
  overflow:hidden;
}
#result::before{
  content:'';position:absolute;inset:8px;border-radius:18px;
  border:1px dashed rgba(240,192,96,.35);pointer-events:none;
}
#result .r-title{font-size:15px;letter-spacing:6px;color:var(--gold);opacity:.85;font-weight:700;}
#result .line{font-size:18px;position:relative;}
#result #r-name{font-size:22px;font-weight:700;margin-top:2px;}
#result .stars{position:relative;font-size:46px;letter-spacing:8px;margin:8px 0 2px;}
#result .stars span{display:inline-block;opacity:0;transform:scale(.2);}
#result .stars span.lit{animation:starpop .55s cubic-bezier(.2,1.6,.4,1) forwards;text-shadow:0 0 16px rgba(240,192,96,.8);}
#result .stars span.dim{opacity:.22;transform:none;}
@keyframes starpop{0%{opacity:0;transform:scale(.2) rotate(-40deg);}60%{opacity:1;transform:scale(1.35) rotate(8deg);}100%{opacity:1;transform:scale(1) rotate(0);}}
#result .big{position:relative;font-size:60px;text-shadow:0 0 22px rgba(240,192,96,.5);}
#result .r-glow{
  position:absolute;left:50%;top:44%;width:340px;height:340px;transform:translate(-50%,-50%);
  pointer-events:none;opacity:0;transition:opacity .5s;
}
#result .r-glow.on{opacity:.75;}
#result .newbest{font-size:24px;}
#result button{min-height:56px;font-size:20px;}

/* 玩法彈窗:放大、金框 */
#modal .box{border-color:rgba(240,192,96,.5);max-width:600px;padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
#modal h3{font-size:24px;}
#modal .sec{font-size:17px;line-height:1.7;}
#modal .sec b{font-size:15px;}
#modal .row button{min-height:56px;font-size:20px;}

/* 觸控目標:全站按鈕與晶片一律 ≥48px(iPad 再放大,見下方斷點) */
button,.btn{min-height:52px;font-size:19px;}
.chip{min-height:44px;font-size:15px;padding:8px 14px;display:inline-flex;align-items:center;}  /* inline-flex:<a> 也吃得到 min-height */
#topbar{min-height:52px;}
.opt{min-height:66px;font-size:18px;}
.dbin{min-height:110px;font-size:17px;}
.ocard{min-height:62px;font-size:18px;}
.oslot{min-height:70px;}
.mcard{min-height:82px;font-size:15px;}
.pchip{width:58px;height:58px;}
#playbtn{min-height:60px;font-size:22px;}
#nextrow button{min-height:60px;font-size:21px;}

/* ── v1.3.0 追加(老師:「各關可單獨設定開啟／暫時關閉」)──
   雲端 globalStats/minigame = { disabled:{gid:true/false}, updatedAt, updatedBy }
   學生端讀:Firestore REST(公開讀、免登入、免 SDK);老師端寫:登入後 SDK。 */
.cell.off .cthumb,.cell.off .cn,.cell.off .cskills,.cell.off .cdiff,.cell.off .cstar,.cell.off .cbest{opacity:.45;filter:grayscale(.85);}   /* 只淡化內容,🚧 標籤與老師的切換鈕維持全亮 */
.cell.off .cn::after{content:' 🚧';}
.coff{
  position:absolute;left:0;right:0;top:44%;text-align:center;z-index:3;pointer-events:none;
  background:rgba(232,64,64,.85);color:#fff;font-weight:700;font-size:15px;padding:5px 0;letter-spacing:2px;
  transform:rotate(-8deg);box-shadow:0 4px 12px rgba(0,0,0,.5);
}
.ctoggle{
  position:absolute;left:8px;top:8px;z-index:4;min-height:0;min-width:0;
  padding:4px 10px;font-size:14px;border-radius:999px;border:2px solid rgba(255,255,255,.5);
  background:rgba(62,200,122,.92);color:#0b1a12;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.4);
}
.ctoggle.isoff{background:rgba(232,64,64,.92);color:#fff;}
#share-btn{background:rgba(74,158,255,.18);border-color:rgba(74,158,255,.5);}
@media (min-width:1024px){ .ctoggle{font-size:16px;padding:6px 12px;} .coff{font-size:18px;} }

/* ── v1.3.0 追加(老師:「圖片全部生成中,先預留圖片掛接」)──

/* ── v1.3.0 引擎 J:寵物調色工坊(colorq)——「區塊比例最多的顏色」 ──
   老師回報舊 12 格塗色版難以理解 ⇒ 改為:一次一題、一個亮起來的區域、四個大色塊選一個;
   答完顯示這一區真正的顏色比例長條。圖片全部改用 repo 既有「寵物名_去背.png」。 */
#colorqbox{margin-top:8px;}
.cq-stage{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;}
.cq-pic{
  position:relative;width:320px;max-width:100%;flex:0 0 auto;
  /* ★ v1.3.0(老師:「這題會讓人想填白色,背景也要遮罩」)—
     底色由米白漸層改為**深色透明格紋**(看起來就是「去背的格子」,不會被當成寵物的白色);
     比例統計本來就只算不透明像素,這裡純顯示層。 */
  background-color:#2a2d34;
  background-image:linear-gradient(45deg,#353941 25%,transparent 25%,transparent 75%,#353941 75%),
                   linear-gradient(45deg,#353941 25%,transparent 25%,transparent 75%,#353941 75%);
  background-size:28px 28px;background-position:0 0,14px 14px;
  border-radius:18px;overflow:hidden;
  border:3px solid rgba(240,192,96,.55);box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.cq-pic::before{content:'';display:block;padding-top:133.333%;}   /* 3:4,舊 iPad 不吃 aspect-ratio */
.cq-pic img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;display:block;}
.cq-dim{position:absolute;width:50%;height:50%;background:rgba(8,9,13,.82);pointer-events:none;}
.cq-frame{
  position:absolute;border:4px solid var(--gold);border-radius:10px;pointer-events:none;
  box-shadow:0 0 0 2px rgba(8,9,13,.6),0 0 18px rgba(240,192,96,.7);
  animation:cqpulse 1.4s ease-in-out infinite;
}
@keyframes cqpulse{0%,100%{box-shadow:0 0 0 2px rgba(8,9,13,.6),0 0 14px rgba(240,192,96,.5);}50%{box-shadow:0 0 0 2px rgba(8,9,13,.6),0 0 26px rgba(240,192,96,.95);}}
.cq-tag{
  position:absolute;left:8px;top:8px;background:rgba(8,9,13,.8);color:var(--gold);font-weight:700;
  font-size:15px;padding:4px 10px;border-radius:999px;border:1px solid rgba(240,192,96,.5);
}
.cq-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;flex:1 1 260px;max-width:380px;}
.cq-opt{
  min-height:92px;border-radius:18px;border:3px solid rgba(232,228,216,.35);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.35);
  font-size:20px;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9);
  transition:transform .1s;
}
.cq-opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35);}
.cq-opt.ok{border-color:var(--grass);box-shadow:0 0 0 4px rgba(62,200,122,.55),0 0 24px rgba(62,200,122,.6);}
.cq-opt.ng{border-color:var(--brick);opacity:.55;}
.cq-opt.off{opacity:.35;}
.cq-note{text-align:center;font-size:15px;opacity:.85;margin-top:10px;}
/* 解說卡裡的比例長條 */
.cq-bars{margin-top:8px;width:100%;flex:0 0 auto;}   /* width 而非 flex-basis:橫式 fb-body 是 column,basis 會變成高度 */
.cq-bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:15px;}
.cq-bar .cqb-name{width:34px;text-align:right;font-weight:700;}
.cq-bar .cqb-track{display:block;flex:1;height:18px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;}
.cq-bar .cqb-fill{display:block;height:100%;border-radius:9px;transition:width .6s ease;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);}   /* 黑色條在深底也看得到 */
.cq-bar .cqb-pct{width:44px;font-weight:700;}
.cq-bar.win .cqb-name{color:var(--gold);}
@media (min-width:1024px){
  .cq-opt{min-height:110px;font-size:24px;}
  .cq-tag{font-size:17px;}
  .cq-bar{font-size:17px;}
  .cq-bar .cqb-track{height:22px;}
}

/* ══════════════════════════════════════════════════════════
 *  v1.3.1(老師三點:縮圖去重／迷宮加難加提示／遊戲頁不要往下超出畫面)
 *  ★ 純覆寫、舊規則零刪除;要回退整段拿掉即可。
 * ══════════════════════════════════════════════════════════ */
/* 迷宮:踩到之前正解與陷阱同一種「石板」外觀(不再金框／紅框洩題) */
.mz.mark{
  background:linear-gradient(180deg,rgba(214,196,160,.38),rgba(150,130,96,.38));
  border:2px solid rgba(240,220,180,.55);color:#fff8e6;font-size:14px;
  text-shadow:0 1px 2px rgba(0,0,0,.7);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);
}
.mz.mark.reach{border-color:rgba(255,255,255,.85);}
@media (min-width:1024px){ .mz.mark{font-size:17px;} }
.mz.trap{background:rgba(210,84,63,.6);border-color:rgba(210,84,63,.95);color:#fff;}
.mz.got{background:var(--grass);border-color:var(--grass);color:#0d2a18;}
.mz.peek{outline:3px solid var(--gold);outline-offset:-3px;box-shadow:0 0 0 3px var(--gold),0 0 20px var(--gold);animation:mzpeek .55s ease-in-out infinite alternate;}
@keyframes mzpeek{from{filter:brightness(1);}to{filter:brightness(1.7);}}
#maze-info{white-space:pre-line;}
#maze-act{gap:8px;}
#maze-act button{flex:1;}

/* 遊戲頁(直式 iPad／手機,上下排列):「下一題」鈕移到解說卡**上面**,答完不必往下捲才按得到 */
#page-play{display:flex;flex-direction:column;}
#play-left{order:1;}
#play-right{order:2;}
#page-play > #nextrow{order:3;margin-top:12px;}
#page-play > #feedback{order:4;margin-top:10px;}

/* 遊戲頁(iPad 橫式／PC):整頁鎖在一個視窗高度內,左欄=橫幅+HUD+下一題+解說(解說自己捲),右欄作答區自己捲 */
@media (min-width:1024px) and (orientation:landscape){
  .wrap{padding-bottom:8px;}
  #page-play{
    display:grid;grid-template-rows:auto auto minmax(0,1fr);
    height:calc(100vh - 96px);max-height:calc(100vh - 96px);
  }
  #play-left{grid-column:1;grid-row:1;order:0;}
  #page-play > #nextrow{grid-column:1;grid-row:2;order:0;margin-top:10px;}
  #page-play > #feedback{grid-column:1;grid-row:3;order:0;margin-top:10px;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #play-right{grid-column:2;grid-row:1 / 4;order:0;min-height:0;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #scene-banner #sb-img,#scene-banner .sb-amb{height:120px;}
  #scene-banner .sb-story{-webkit-line-clamp:2;}
  #hud{gap:6px;margin:0 0 6px;}
  .stat{font-size:16px;padding:6px 11px;min-height:42px;}
  #timering{width:50px;height:50px;}
  #timering .tnum{font-size:19px;}
  #hud .chip{min-height:42px;font-size:15px;padding:6px 11px;}
  #feedback .fb-img{height:120px;}
  #maze-info{font-size:16px;margin-top:6px;}
}
/* iPad 橫式(1024×768／1180×820)高度更吃緊:橫幅縮到 84px、story 收起 */
@media (min-width:1024px) and (orientation:landscape) and (max-height:840px){
  #scene-banner #sb-img,#scene-banner .sb-amb{height:84px;}
  #scene-banner .sb-story{display:none;}
  #scene-banner .sb-name{font-size:20px;}
  #scene-banner .sb-txt{padding:6px 12px 8px;}
  #feedback .fb-img{height:96px;}
  #feedback{font-size:16px;}
  #feedback .fb-head{font-size:19px;padding:8px 12px;}
  #nextrow button{min-height:54px;font-size:20px;}
}

/* ══════════════════════════════════════════════════════════
 *  v1.4.0(老師四點:聽音坊演奏/拍子/經典旋律 ／ 算數大進擊射擊+爆炸+高難度雙倍 ／ 暫停+用時加成 ／ 音量拉桿)
 *  ★ 純新增規則、舊規則零刪除;要回退整段拿掉即可。
 * ══════════════════════════════════════════════════════════ */
/* ── 音量面板(同主程式 ctrl-vol-panel 的樣子)── */
#mg-vol-panel{
  position:fixed;top:78px;right:16px;z-index:125;width:300px;
  background:rgba(10,12,24,.96);border:1.5px solid rgba(255,255,255,.22);border-radius:14px;
  padding:16px 18px;box-shadow:0 8px 28px rgba(0,0,0,.6);backdrop-filter:blur(8px);
}
#mg-vol-panel .mvp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
#mg-vol-panel .mvp-head b{font-size:20px;color:var(--gold);}
#mg-vol-panel .mvp-x{padding:2px 10px;font-size:16px;min-height:0;background:rgba(60,10,10,.4);border:1.5px solid #e84040;color:#e84040;border-radius:7px;}
#mg-vol-panel .mvp-row{display:flex;align-items:center;gap:10px;font-size:18px;}
#mg-vol-panel input[type=range]{flex:1;width:100%;accent-color:var(--gold);height:30px;cursor:pointer;}
#mg-vol-panel .mvp-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
#mg-vol-panel .mvp-foot span{font-size:14px;color:#8a8a9a;}
#mg-vol-panel .mvp-foot b{font-size:20px;color:#eee;min-width:64px;text-align:right;}
/* ── 暫停遮罩 ── */
#pausebox{
  position:fixed;inset:0;z-index:118;display:none;align-items:center;justify-content:center;
  background:rgba(6,8,14,.82);backdrop-filter:blur(3px);
}
#pausebox.on{display:flex;}
#pausebox .pz{
  text-align:center;background:var(--tea);border:2.5px solid var(--gold);border-radius:22px;
  padding:30px 36px;max-width:420px;box-shadow:0 14px 40px rgba(0,0,0,.6);
}
#pausebox .pz h2{margin:0 0 8px;font-size:34px;color:var(--gold);}
#pausebox .pz p{margin:6px 0 18px;font-size:17px;opacity:.85;line-height:1.5;}
#pausebox .pz .pz-clock{font-size:26px;font-weight:700;color:#fff;margin-bottom:14px;}
#pausebox .pz button{min-width:200px;font-size:22px;}
#pause-btn.on{background:rgba(232,64,64,.22);border-color:#e84040;}
/* ── 算數大進擊:射擊 ── */
#reactbox{cursor:crosshair;}
#reactbox .rgun{
  position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  font-size:34px;line-height:1;pointer-events:none;z-index:7;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));
  transition:transform .08s ease-out;
}
#reactbox .rbullet{
  position:absolute;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle,#fff6c8 0%,var(--gold) 55%,rgba(240,192,96,0) 100%);
  box-shadow:0 0 10px 3px rgba(240,192,96,.7);pointer-events:none;z-index:8;
  transition:transform .13s linear;
}
.rdrop.hard{
  border:2.5px solid var(--gold);
  box-shadow:0 0 0 2px rgba(240,192,96,.35),0 0 18px 4px rgba(240,192,96,.75),0 4px 10px rgba(0,0,0,.4);
  animation:rhardglow 1s ease-in-out infinite alternate;
}
.rdrop.hard .rx2{
  position:absolute;top:-10px;right:-8px;font-size:12px;padding:1px 6px;border-radius:8px;
  background:var(--gold);color:#2b2b2b;font-weight:700;
}
@keyframes rhardglow{from{box-shadow:0 0 0 2px rgba(240,192,96,.25),0 0 10px 2px rgba(240,192,96,.55);}to{box-shadow:0 0 0 3px rgba(240,192,96,.55),0 0 24px 6px rgba(240,192,96,.95);}}
.rdrop.blown{animation:rblown .35s ease-in forwards;pointer-events:none;}
@keyframes rblown{to{opacity:0;transform:scale(.2) rotate(30deg);}}
#reactbox .rboom{
  position:absolute;pointer-events:none;z-index:9;transform:translate(-50%,-50%);
  width:220px;height:220px;object-fit:contain;
}
@media (min-width:1024px){ #reactbox .rgun{font-size:44px;} #reactbox .rboom{width:300px;height:300px;} }
/* ── 聽音坊:動物琴鍵 ── */
#earkb{display:none;margin-top:12px;}
#earkb.on{display:block;}
#earkb .kb-row{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
#earkb .kkey{
  min-height:98px;padding:6px 2px 8px;border-radius:14px;border:2px solid rgba(232,228,216,.22);
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;
  font-size:15px;line-height:1.1;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:transform .08s,background .08s;
}
#earkb .kkey .kani{font-size:34px;line-height:1;margin-bottom:4px;}
#earkb .kkey .kani img{width:44px;height:44px;object-fit:contain;display:block;}
#earkb .kkey .klab{font-weight:700;color:var(--gold);}
#earkb .kkey .klab small{display:block;font-size:12px;color:#ddd;opacity:.85;font-weight:400;}
#earkb.nolabel .kkey .klab{visibility:hidden;}
#earkb .kkey.lit{background:var(--gold);color:#2b2b2b;transform:translateY(-4px) scale(1.04);}
#earkb .kkey.lit .klab,#earkb .kkey.lit .klab small{color:#2b2b2b;}
#earkb .kkey.hint{outline:3px solid var(--grass);outline-offset:-3px;animation:mzpeek .5s ease-in-out infinite alternate;}
#earkb .kb-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap;}
#earkb .kb-tools label{display:inline-flex;align-items:center;gap:6px;font-size:15px;cursor:pointer;}
#earkb .kb-tools input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);}
#earkb .kb-tools .btn-ghost{min-height:44px;padding:8px 14px;font-size:15px;}
#earkb .kb-input{
  min-height:52px;margin-top:10px;padding:8px 12px;border-radius:12px;
  background:rgba(0,0,0,.28);border:1.5px dashed rgba(232,228,216,.3);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:18px;font-weight:700;
}
#earkb .kb-input .kn{padding:4px 10px;border-radius:9px;background:rgba(240,192,96,.18);border:1px solid rgba(240,192,96,.5);}
#earkb .kb-input .kn.ref{background:rgba(255,255,255,.08);border-style:dashed;opacity:.85;}
#earkb .kb-input .kn.ok{background:rgba(79,191,125,.28);border-color:var(--grass);}
#earkb .kb-input .kn.ng{background:rgba(210,84,63,.35);border-color:var(--brick);}
#earkb .kb-input .kb-ph{opacity:.55;font-weight:400;font-size:15px;}
#earkb .kb-score{margin-top:8px;text-align:center;font-size:16px;opacity:.9;}
#earkb .kb-score .kn{padding:3px 8px;}
/* ── 聽音坊:拍子鼓 ── */
#eardrum{display:none;margin-top:12px;text-align:center;}
#eardrum.on{display:block;}
#eardrum .drum{
  width:170px;height:170px;margin:6px auto;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#f7e2b8 0%,#d4a45a 55%,#8b5a2b 100%);
  border:6px solid #5b3a1a;box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 -8px 16px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;font-size:60px;cursor:pointer;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .06s;
}
#eardrum .drum img{width:120px;height:120px;object-fit:contain;pointer-events:none;}
#eardrum .drum.hit{transform:scale(.93);}
#eardrum .beats{display:flex;justify-content:center;gap:8px;min-height:36px;margin-top:6px;flex-wrap:wrap;}
#eardrum .beats .bt{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(232,228,216,.35);}
#eardrum .beats .bt.long{width:52px;border-radius:14px;}
#eardrum .beats .bt.on{background:var(--gold);border-color:var(--gold);}
#eardrum .beats .bt.me{background:var(--grass);border-color:var(--grass);}
#eardrum .beats .bt.miss{background:var(--brick);border-color:var(--brick);}
#eardrum .dnote{font-size:15px;opacity:.85;margin-top:6px;}
#eardrum .dtools{display:flex;justify-content:center;gap:10px;margin-top:8px;}
#eardrum .dtools .btn-ghost{min-height:44px;padding:8px 14px;font-size:15px;}
@media (min-width:1024px){
  #earkb .kkey{min-height:124px;font-size:18px;} #earkb .kkey .kani{font-size:44px;} #earkb .kkey .kani img{width:58px;height:58px;}
  #earkb .kkey .klab small{font-size:14px;} #earkb .kb-input{font-size:22px;min-height:60px;}
  #eardrum .drum{width:210px;height:210px;font-size:76px;} #eardrum .drum img{width:150px;height:150px;}
  #eardrum .beats .bt{width:32px;height:32px;} #eardrum .beats .bt.long{width:64px;}
}
/* ★ v1.4.1 錯誤算式不再另色(保險:即使日後有人補回 .bad 也同色) */
.rdrop.bad{background:var(--paper);}
/* 結算頁用時列 */
#r-time{font-size:15px;opacity:.9;margin-top:4px;}
#r-time b{color:var(--gold);}

/* ══════════════════════════════════════════════════════════
 *  v1.5.0(老師兩點:①地圖按鈕/地圖放大、解說圖文放大且圖片不裁切(全引擎共用) ②整體放大接近滿版、
 *        不超出 iPad/PC/手機橫式解析度、右上全螢幕鈕、強制橫式)
 *  ★ 純覆寫、舊規則零刪除;要回退整段拿掉即可。
 *  ★ 尺寸一律「px 先寫、clamp() 後寫」:舊 iPad(iOS<13.4)不認 clamp 會沿用前一行 px,新機吃 clamp 依視窗伸縮。
 * ══════════════════════════════════════════════════════════ */
/* ── 強制橫式遮罩:只在「觸控裝置 + 直式」顯示;PC 視窗直式不觸發(同主程式 rotate-device-overlay 口徑)── */
#rotate-overlay{
  position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;text-align:center;
  background:rgba(6,8,14,.97);padding:24px;
}
#rotate-overlay .ro-inner{max-width:420px;}
#rotate-overlay .ro-icon{font-size:72px;line-height:1;animation:roturn 1.6s ease-in-out infinite;}
@keyframes roturn{0%,20%{transform:rotate(0);}60%,100%{transform:rotate(90deg);}}
#rotate-overlay h2{margin:14px 0 6px;font-size:28px;color:var(--gold);}
#rotate-overlay p{margin:4px 0;font-size:17px;opacity:.85;line-height:1.5;}
@media (orientation:portrait) and (hover:none) and (pointer:coarse){ #rotate-overlay{display:flex;} }

/* ── 解說卡(全引擎共用):圖片不裁切、圖與字放大 ── */
#feedback .fb-body{flex-direction:column;gap:10px;}
#feedback .fb-img{
  flex:0 0 auto;width:100%;height:auto;max-height:36vh;object-fit:contain;   /* ★ contain = 完整不裁切 */
  background:rgba(0,0,0,.28);border-radius:14px;
}
#feedback .fb-txt{font-size:inherit;}

/* ── 橫式(所有裝置):滿版兩欄、鎖一個視窗高 ── */
@media (orientation:landscape){
  .wrap{max-width:none;width:100%;box-sizing:border-box;padding:6px 16px 6px;}
  #topbar{min-height:56px;gap:8px;padding:4px 2px 2px;}
  .chip{min-height:48px;font-size:17px;font-size:clamp(15px,1.35vw,21px);padding:8px 16px;}
  #page-play{
    display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-columns:minmax(300px,31vw) minmax(0,1fr);
    grid-template-rows:auto auto minmax(0,1fr);column-gap:18px;align-items:start;
    height:calc(100vh - 78px);max-height:calc(100vh - 78px);
  }
  #play-left{grid-column:1;grid-row:1;order:0;}
  #page-play > #nextrow{grid-column:1;grid-row:2;order:0;margin-top:10px;}
  #page-play > #feedback{grid-column:1;grid-row:3;order:0;margin-top:10px;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #play-right{grid-column:2;grid-row:1 / 4;order:0;min-height:0;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #scene-banner{height:auto;margin:0 0 8px;}
  #scene-banner #sb-img,#scene-banner .sb-amb{height:110px;height:clamp(84px,13vh,150px);}
  #scene-banner .sb-txt{position:static;background:var(--ink2);padding:8px 14px 10px;}
  #scene-banner .sb-name{font-size:22px;font-size:clamp(18px,1.7vw,28px);}
  #scene-banner .sb-story{font-size:15px;font-size:clamp(13px,1.15vw,18px);-webkit-line-clamp:2;}
  #hud{gap:6px;margin:0 0 6px;flex-wrap:wrap;}
  .stat{font-size:17px;font-size:clamp(15px,1.35vw,21px);padding:6px 12px;min-height:44px;}
  #timering{width:54px;height:54px;}
  #timering .tnum{font-size:20px;}
  #hud .chip{min-height:44px;}
  #nextrow button{min-height:60px;font-size:22px;font-size:clamp(18px,1.7vw,26px);}
  #feedback{font-size:17px;font-size:clamp(16px,1.4vw,23px);line-height:1.65;}
  #feedback .fb-head{font-size:20px;font-size:clamp(18px,1.6vw,26px);padding:10px 14px;}
  #feedback .fb-body{padding:12px 14px 14px;}
  /* 右欄:題卡與選項放大 */
  #card-area{margin-top:0;}
  .card{min-height:96px;font-size:26px;font-size:clamp(20px,2.1vw,34px);padding:16px 20px;line-height:1.45;}
  .opts{margin-top:12px;gap:12px;}
  .opt{min-height:76px;min-height:clamp(60px,9.5vh,100px);font-size:21px;font-size:clamp(17px,1.65vw,27px);}
  /* 地圖:整張圖吃滿右欄高度、圓點更大更好按 */
  #mapbox{margin-top:6px;padding:6px;display:flex;justify-content:center;}
  #tw-svg{display:block;height:calc(100vh - 235px);max-height:calc(100vh - 235px);width:auto;max-width:100%;}
  .spot{stroke-width:.9;}
  .spotlbl{font-size:4.1px;}
  /* 其他引擎容器 */
  #reactbox{height:calc(100vh - 215px);min-height:300px;}
  #matchbox{grid-template-columns:repeat(4,1fr);}
  .mcard{min-height:130px;min-height:clamp(96px,17vh,170px);font-size:20px;font-size:clamp(16px,1.6vw,24px);}
  #earkb .kkey{min-height:110px;min-height:clamp(84px,17vh,130px);}
  .cell{height:170px;}
  #grid{grid-template-columns:repeat(5,1fr);gap:12px;}
}
/* ── 手機橫式(高 ≤ 520):橫幅收起、字級縮、頂列精簡 ── */
@media (orientation:landscape) and (max-height:520px){
  .wrap{padding:4px 10px 4px;}

/* ── 老師:「回收大隊上方垃圾圖片要去除背景」— 拖曳卡由米色大卡改成「只剩去背圖+一行字」,
      拖曳中再縮到 62% 且完全透明底,手指下方的籃子看得清楚(全裝置) ── */
#drag-item{
  background:transparent !important;border:none !important;box-shadow:none !important;
  padding:6px 8px 4px !important;color:var(--mist);text-shadow:0 2px 6px rgba(0,0,0,.85);
  width:auto;max-width:360px;margin:0 auto;font-size:24px;
}
#drag-item .pic-drag{width:180px;height:180px;margin:0 auto 4px;}
#drag-item .dgrip{color:var(--mist);opacity:.7;}
#drag-item.dragging{opacity:1;}
#drag-item.dragging .dgrip{visibility:hidden;}
#drag-item.dragging .pic-drag{filter:drop-shadow(0 12px 18px rgba(0,0,0,.7));}
#dragbox{margin-top:0;}

/* ── 老師:「所有關卡『下一題』鈕移到最右下(防 iPad 觸碰不到)」—
      固定在視窗右下角,距底 22px + iOS 安全區(env(safe-area-inset-bottom)),距右 18px + 安全區;
      z 116 低於暫停遮罩 118、toast 120;作答後才出現,蓋到已鎖定的作答區不影響操作。 ── */
@media (orientation:landscape){
  #page-play > #nextrow{
    position:fixed;right:18px;bottom:22px;
    right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
    z-index:116;margin:0;width:auto;min-width:240px;max-width:38vw;
  }
  #page-play > #nextrow button{min-height:66px;font-size:24px;font-size:clamp(20px,1.9vw,30px);padding:12px 34px;box-shadow:0 10px 28px rgba(0,0,0,.6),0 0 0 3px rgba(240,192,96,.35);}
  #page-play{grid-template-rows:auto minmax(0,1fr);}                 /* 原第 2 列(下一題)已抽離版面 */
  #page-play > #feedback{grid-row:2;}
  #play-right{grid-row:1 / 3;padding-bottom:90px;box-sizing:border-box;}   /* 右欄底部留高,最後一列選項不被固定鈕蓋住 */
}
@media (orientation:landscape) and (max-height:520px){
  #page-play > #nextrow{min-width:170px;right:10px;bottom:10px;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));}

  #play-right{padding-bottom:60px;}
}

<script>
/* ============================================================================

(function(){
'use strict';

var MG_VER = 'v1.5.0';

/* ══════════════════════════════════════════════════════════
 *  測試期閘門(老師 2026-09-04 裁定「丙」:小遊戲暫時只給 GM 測試)

 *  ⚠⚠ 正式對學生開放時,把下面這一行改成 false 就好,其餘一行都不必動。⚠⚠
 *
 *  ★ 為什麼閘門要做在這裡,而不是只把主程式首頁那顆按鈕藏起來:

 *    但目的只是「暫時不要讓學生玩到半成品」,對小學生足夠。
 *    真正的資料安全仍然由 firestore.rules 負責(小遊戲只寫得到自己的 minigameScores)。
 * ══════════════════════════════════════════════════════════ */
var _MG_ADMIN_ONLY = false;   /* ★ v1.3.0(老師 2026-09-05)正式開放:玩家不用登入即可直接玩;測試期閘門程式碼保留,改回 true 即恢復 */
/* 與主程式 index.html 的 ADMIN_EMAILS 同一份名單(該名單本來就寫在公開的前端檔裡,
   複製過來沒有新增任何資訊外洩)。日後主程式增減管理員,記得同步這裡。 */
var MG_ADMIN_EMAILS = ['clarebox123@gmail.com', 'clarebox123@lsps.tp.edu.tw', 'asemia@gmail.com'];

function mgIsAdmin(u){
  if(!u || !u.email) return false;
  var e = String(u.email).toLowerCase(), i;
  for(i = 0; i < MG_ADMIN_EMAILS.length; i++){

}
/* 現在這個人可不可以看到九宮格? */
function mgUnlocked(){

}

/* ── 全域狀態 ────────────────────────────────────────────── */
var MG = {
  style : 'f',    // 'f' 精緻風 / 's' 簡單風(鐵律 1.232 雙版文案)
  games : [],
  cur   : null,   // 目前遊戲資料
  order : [],     // 本局題序
  idx   : 0,
  score : 0,
  right : 0,
  combo : 0,
  maxCombo : 0,
  answered : false,
  timer : null,
  tleft : 0,
  best  : {},     // { gameId: {score,stars,acc} } — 未登入時只活在記憶體
  user  : null,
  fb    : null,   // { app, auth, db }
  fbLoading : false,
  audioCtx : null,
  pendingGame : null
};

/* ── 小工具 ──────────────────────────────────────────────── */
function $(id){ return document.getElementById(id); }
function show(id){ var e=$(id); if(e) e.classList.remove('hidden'); }
function hide(id){ var e=$(id); if(e) e.classList.add('hidden'); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
/* 依目前字體風格取雙版文字;只給字串時直接回傳 */
function tx(o){
  if(o == null) return '';
  if(typeof o === 'string') return o;
  var v = o[MG.style];
  if(v == null) v = (o.f != null ? o.f : o.s);
  return v == null ? '' : v;
}
function playSfx(id, vol){
  try{
    var a = $(id); if(!a) return;
    if(_mgVolSfx <= 0) return;                                            /* ★ v1.4.0 音效靜音 */
    a.currentTime = 0;
    a.volume = Math.max(0, Math.min(1, (vol == null ? 0.55 : vol) * _mgVolSfx));   /* ★ v1.4.0 × 使用者音效音量 */
    var p = a.play();
    if(p && p['catch']) p['catch'](function(){});
  }catch(e){}
}
var _toastT = null;
function toast(msg){
  var t = $('toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  if(_toastT) clearTimeout(_toastT);
  _toastT = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function shuffle(arr){
  var a = arr.slice(), i, j, t;
  for(i = a.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ── 標題圖後備(webp → png → 純文字)──────────────────── */
window.mgTitleFallback = function(img){

    img.setAttribute('data-fb','1');

/* ══════════════════════════════════════════════════════════
 *  測試期閘門畫面(丙案:學生看到的是「預告卡」不是「擋門」)
 * ══════════════════════════════════════════════════════════ */

  $('gate-p').textContent = (MG.style === 's')

    : '這裡以後會有很多款木柵與台灣的小遊戲。老師正在加入新玩法、調整畫面和音樂,'
    + '等調整好就會開放給大家玩,先回「小英雄大對抗」繼續冒險吧!';
  mgMascot('gate-mascot', 'gate-bubble', (MG.style === 's')
    ? '我是轉學生學霸,小學堂快做好了,再等一下下!'
    : '我是轉學生學霸!小學堂還在最後調整,開放的時候我會在這裡等大家。');
  $('gate-note').textContent = (MG.style === 's')
    ? '(老師要測試請按上面的老師登入)'
    : '(這是老師的測試入口;學生不需要登入,直接回大作戰就好)';
}

/* 老師登入 → 通過就解鎖九宮格 */
window.mgGateLogin = function(){
  playSfx('sfx-tap', 0.35);
  mgLoginTap();
};

/* 依「解鎖狀態」決定要顯示閘門還是九宮格。
   ⚠ 這是單一收口點:boot / 登入成功 / 登出 三處都走它,不各寫一份切頁邏輯,
     免得日後只改一邊、出現「登出後九宮格還留在畫面上」這種漏口。 */
function applyGate(){
  if(mgUnlocked()){
    hide('page-gate');
    /* 只有在沒有正在玩、也沒有停在結算頁時才把首頁叫出來 */
    if($('page-play').classList.contains('hidden')
       && $('page-result').classList.contains('hidden')) show('page-home');
    show('style-btn');
    if(!$('page-home').classList.contains('hidden')) mgSetScene(MG_HOME_SCENE);   /* ★ v1.3.0 */
  }else{
    /* 測試期:非管理員一律停在閘門,連首頁都不給看到 */
    hide('page-home'); hide('page-play'); hide('page-result');
    hide('back-btn');
    show('page-gate');
    renderGate();
    bgmStop();
    mgSetScene('');               /* ★ v1.3.0 閘門頁不放場景,維持純色底 */
  }
}

/* ══════════════════════════════════════════════════════════
 *  BGM(老師需求 3)
 *  ★ 全部沿用主程式既有音樂,零新素材。
 *  ★ iOS/iPadOS 一律禁止「沒有使用者手勢」的自動播放 ⇒
 *    只能在第一次觸碰畫面之後才起播(_bgmArm 掛一次性監聽)。
 *    若不這樣做,play() 會被瀏覽器拒絕,而且是**靜默**拒絕 —— 老師會以為 BGM 沒做。
 * ══════════════════════════════════════════════════════════ */
var _bgmOn = true;      // 使用者偏好(存 localStorage mg_bgm)
var _bgmCur = '';       // 目前這一軌的 id
var _bgmArmed = false;  // 是否已經拿到使用者手勢
/* ★ v1.4.0(老師需求④「音樂/音效音量調整,同小英雄大對抗的設計」)
 *   使用者音量 0~1,存 localStorage mg_vol_bgm / mg_vol_sfx(裝置層偏好,不上雲)。
 *   ★ 所有播放點只乘一次:bgmPlay 的 vol 參數 × _mgVolBgm;playSfx 的 vol × _mgVolSfx;
 *     聽音坊 WebAudio 的 gain 亦乘 _mgVolSfx ⇒ 一顆拉桿管到所有聲音,不會有漏網。
 *   ★ _bgmOn 保留為「音樂音量 > 0」的投影:舊 mg_bgm='0' 只在沒有 mg_vol_bgm 時才當成 0(一次性遷移)。 */
var _mgVolBgm = 1, _mgVolSfx = 1;
var _bgmBaseVol = 0.34;  // bgmPlay 未指定音量時的基準(原寫死值),供拉桿即時套用
function _mgVolLoad(){
  try{
    var b = localStorage.getItem('mg_vol_bgm'), s = localStorage.getItem('mg_vol_sfx');
    if(b !== null && b !== ''){ _mgVolBgm = Math.max(0, Math.min(1, parseInt(b, 10) / 100)); }
    else if(localStorage.getItem('mg_bgm') === '0'){ _mgVolBgm = 0; }
    if(s !== null && s !== ''){ _mgVolSfx = Math.max(0, Math.min(1, parseInt(s, 10) / 100)); }
  }catch(e){}
  if(isNaN(_mgVolBgm)) _mgVolBgm = 1;
  if(isNaN(_mgVolSfx)) _mgVolSfx = 1;
  _bgmOn = _mgVolBgm > 0;
}
function _mgVolSave(){
  try{
    localStorage.setItem('mg_vol_bgm', String(Math.round(_mgVolBgm * 100)));
    localStorage.setItem('mg_vol_sfx', String(Math.round(_mgVolSfx * 100)));
    localStorage.setItem('mg_bgm', _bgmOn ? '1' : '0');   /* 舊鍵同步,日後回退版本也讀得懂 */
  }catch(e){}
}
function _mgVolBtnSync(){
  var bb = $('bgm-btn'), sb = $('sfx-btn');
  if(bb) bb.textContent = (_mgVolBgm <= 0) ? '🔇' : '🎵';
  if(sb) sb.textContent = (_mgVolSfx <= 0) ? '🔕' : '🔊';
}
/* 音樂音量即時套到「正在播的那一軌」(不重頭播) */
function _mgApplyBgmVolLive(){
  if(!_bgmCur) return;
  var a = $(_bgmCur); if(!a) return;
  try{ a.volume = Math.max(0, Math.min(1, (a._mgBase || _bgmBaseVol) * _mgVolBgm)); }catch(e){}
}

function bgmStop(){
  /* ★ v1.3.0 — 改成掃描所有 id 以 bgm- 開頭的 <audio>:
     每款專屬 BGM 加了七軌,若還是寫死清單,漏列的那一軌會「停不下來」跟新曲疊在一起。 */
  var all = document.getElementsByTagName('audio'), i, a;
  for(i = 0; i < all.length; i++){
    a = all[i];
    if(a.id && a.id.indexOf('bgm-') === 0){ try{ a.pause(); }catch(e){} }
  }
  _bgmCur = '';
}
/* ★ v1.3.0 — 遊戲中該播哪一軌:讀資料表 bgm 欄位;沒寫或那個 id 不存在就退回原本的知識王曲 */
function mgGameBgm(x){
  var id = (x && x.bgm) ? String(x.bgm) : '';
  return (id && $(id)) ? id : 'bgm-play';
}
function bgmPlay(id, vol, once){
  if(!_bgmOn || !_bgmArmed) { _bgmCur = id; return; }   // 記住想播哪首,拿到手勢後補播
  if(_bgmCur === id && !once){
    var cu = $(id);
    if(cu && !cu.paused) return;                        // 同一首已經在播,不要重頭切
  }
  bgmStop();
  _bgmCur = id;
  var a = $(id); if(!a) return;
  try{
    a._mgBase = (vol == null ? _bgmBaseVol : vol);                 /* ★ v1.4.0 記住基準,拉桿即時套用時用 */
    a.volume = Math.max(0, Math.min(1, a._mgBase * _mgVolBgm));    /* ★ v1.4.0 × 使用者音樂音量 */
    if(once) a.currentTime = 0;
    var p = a.play();
    if(p && p['catch']) p['catch'](function(){});       // 被擋就算了,不影響玩遊戲
  }catch(e){}
}
/* 第一次觸碰畫面 → 解除自動播放封鎖,並把「剛才想播的那一首」補播出來 */
function _bgmArm(){
  if(_bgmArmed) return;
  _bgmArmed = true;
  var want = _bgmCur; _bgmCur = '';
  if(want) bgmPlay(want);
}
/* ★ v1.4.0 — 🎵/🔊 由「開/關」改為開啟音量調整面板(同主程式 v5.37.0 ctrlOpenVolumePanel 的設計):
 *   拉桿 0~100、步進 5、0 = 靜音;同一顆鈕再點一次 = 關閉面板;點面板外側自動關閉;
 *   放開拉桿時音效試聽一聲。
 *   ★ 舊 mgToggleBgm 名稱保留(HTML onclick 沿用),行為改為開面板。 */
window.mgToggleBgm = function(){ mgOpenVolPanel('bgm'); };
window.mgToggleSfx = function(){ mgOpenVolPanel('sfx'); };
function mgOpenVolPanel(kind){
  var old = $('mg-vol-panel');
  if(old){
    var same = (old.getAttribute('data-kind') === kind);
    mgCloseVolPanel();
    if(same) return;
  }
  playSfx('sfx-tap', 0.3);
  var isBgm = (kind === 'bgm');
  var cur = Math.round((isBgm ? _mgVolBgm : _mgVolSfx) * 100);
  var pv = document.createElement('div');
  pv.id = 'mg-vol-panel';
  pv.setAttribute('data-kind', kind);
  pv.innerHTML = '<div class="mvp-head"><b>' + (isBgm ? (MG.style === 's' ? '🎵 音樂大小聲' : '🎵 音樂音量') : (MG.style === 's' ? '🔊 音效大小聲' : '🔊 音效音量')) + '</b>'
    + '<button class="mvp-x" onclick="mgCloseVolPanel()">✕</button></div>'
    + '<div class="mvp-row"><span>🔇</span>'
    + '<input type="range" id="mg-vol-slider" min="0" max="100" step="5" value="' + cur + '"'
    + ' oninput="mgVolInput(\'' + kind + '\',this.value)" onchange="mgVolDone(\'' + kind + '\',this.value)">'
    + '<span>🔊</span></div>'
    + '<div class="mvp-foot"><span>' + (MG.style === 's' ? '拉到最左邊就沒聲音囉' : '拉桿最左端 = 靜音') + '</span>'
    + '<b id="mg-vol-pct">' + (cur <= 0 ? '靜音' : (cur + '%')) + '</b></div>';
  document.body.appendChild(pv);
  setTimeout(function(){ document.addEventListener('click', _mgVolOutside, true); }, 0);
}
function _mgVolOutside(e){
  try{
    var pv = $('mg-vol-panel');
    if(!pv){ document.removeEventListener('click', _mgVolOutside, true); return; }
    if(pv.contains(e.target)) return;
    var b1 = $('bgm-btn'), b2 = $('sfx-btn');
    if((b1 && b1.contains(e.target)) || (b2 && b2.contains(e.target))) return;
    mgCloseVolPanel();
  }catch(_){}
}
function mgCloseVolPanel(){
  var pv = $('mg-vol-panel');
  if(pv && pv.parentNode) pv.parentNode.removeChild(pv);
  document.removeEventListener('click', _mgVolOutside, true);
}
window.mgVolInput = function(kind, v){
  var pct = Math.max(0, Math.min(100, parseInt(v, 10) || 0));
  var p = $('mg-vol-pct'); if(p) p.textContent = pct <= 0 ? '靜音' : (pct + '%');
  if(kind === 'bgm'){
    var wasOn = _bgmOn;
    _mgVolBgm = pct / 100; _bgmOn = _mgVolBgm > 0;
    if(!_bgmOn){ bgmStop(); }

/* ★ v1.5.0 — 全螢幕(老師需求②「同小英雄大作戰的設計」):
 *   已在全螢幕 → 離開;否則 requestFullscreen(各前綴,navigationUI:hide);
 *   iPad Safari 不支援 requestFullscreen 時退 screen.orientation.lock('landscape');
 *   fullscreenchange 同步圖示,進入時順手鎖橫式。⚠ iOS Safari 只有 PWA 安裝版才有真全螢幕,一般分頁按了會靜默無效(與主程式相同限制)。 */
window.mgFullscreen = function(){
  playSfx('sfx-tap', 0.3);
  var el = document.documentElement;
  var isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if(isFs){
    var ex = document.exitFullscreen || document.webkitExitFullscreen;
    if(ex){ try{ var pe = ex.call(document); if(pe && pe['catch']) pe['catch'](function(){}); }catch(e){} }
    return;
  }
  var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  var lock = function(){ try{ if(screen.orientation && screen.orientation.lock){ var pl = screen.orientation.lock('landscape'); if(pl && pl['catch']) pl['catch'](function(){}); } }catch(e){} };
  if(req){
    try{
      var p = req.call(el, { navigationUI: 'hide' });
      if(p && p['catch']) p['catch'](function(){ lock(); toast(MG.style === 's' ? '這台裝置要先「加入主畫面」才能全螢幕喔' : '此裝置瀏覽器不支援全螢幕;請用「加入主畫面」安裝後開啟'); });
    }catch(e){ lock(); }
  }else{
    lock();
    toast(MG.style === 's' ? '這台裝置要先「加入主畫面」才能全螢幕喔' : '此裝置瀏覽器不支援全螢幕;請用「加入主畫面」安裝後開啟');
  }
};
(function(){
  var evs = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange'], i;
  function sync(){
    var isFs = document.fullscreenElement || document.webkitFullscreenElement;
    var b = $('fs-btn'); if(b){ b.textContent = isFs ? '🡼' : '⛶'; b.title = isFs ? '離開全螢幕' : '全螢幕'; }
    if(isFs){ try{ if(screen.orientation && screen.orientation.lock){ var pl = screen.orientation.lock('landscape'); if(pl && pl['catch']) pl['catch'](function(){}); } }catch(e){} }
  }
  for(i = 0; i < evs.length; i++) document.addEventListener(evs[i], sync);
})();

/* ══════════════════════════════════════════════════════════
 *  ★ v1.3.0 — 各關開／關設定(老師需求①)
 *  雲端文件:globalStats/minigame = { disabled:{ <gid>: true|false }, updatedAt, updatedBy }
 *  ★ 為什麼用 globalStats:firestore.rules 既有「allow read: if true; allow write: if isAdmin()」
 *    ⇒ 學生免登入就讀得到、只有老師寫得進、零 rules 改動。
 *  ★ 學生端讀取走 Firestore REST(一支 fetch,免載 SDK ⇒ 不拖慢首載,舊 iPad 也輕);
 *    老師端寫入走登入後的 SDK(set merge)。
 *  ★ disabled 一律存布林(關=true、重新開=false),不用刪鍵:set merge 對 map 是深合併,刪不掉鍵。
 *  ★ 本機快取 mg_cfg:先用快取畫、雲端到了再重畫;完全讀不到就當全部開放(寧可多開,不讓學生沒得玩)。
 * ══════════════════════════════════════════════════════════ */
var MG_CFG = { disabled: {} };
var MG_CFG_REST = 'https://firestore.googleapis.com/v1/projects/lxpsgame/databases/(default)/documents/globalStats/minigame';
function mgGameOff(id){ return !!(MG_CFG.disabled && MG_CFG.disabled[id] === true); }
function mgCfgApply(dis, save){
  MG_CFG.disabled = dis || {};
  if(save){ try{ localStorage.setItem('mg_cfg', JSON.stringify(MG_CFG.disabled)); }catch(e){} }
  try{ renderGrid(); }catch(e){}
}
function mgCfgLoad(){
  try{ var c = localStorage.getItem('mg_cfg'); if(c){ MG_CFG.disabled = JSON.parse(c) || {}; } }catch(e){}
  if(!window.fetch) return;
  try{
    fetch(MG_CFG_REST + '?t=' + Date.now(), { cache: 'no-store' }).then(function(r){
      if(r.status === 404){ mgCfgApply({}, true); return null; }   /* 文件還沒建=全部開放 */
      return r.ok ? r.json() : null;
    }).then(function(j){
      if(!j || !j.fields) return;
      var dis = {}, f = j.fields.disabled, k;
      if(f && f.mapValue && f.mapValue.fields){
        for(k in f.mapValue.fields){
          if(!f.mapValue.fields.hasOwnProperty(k)) continue;
          dis[k] = (f.mapValue.fields[k].booleanValue === true);
        }

/* ══════════════════════════════════════════════════════════
 *  一局的流程
 * ══════════════════════════════════════════════════════════ */
/* ★ v1.1.0 — 各引擎的「題目陣列」放在哪個欄位,收攏成一張表。
   ⚠ 這是單一真相:日後再加引擎只要在這裡補一行,不必回頭改 startGame。
     舊寫法是一長串三元運算子,每加一個引擎就得改一次,是典型會漏掉的地方。 */
var _POOL_FIELD = {
  sort:'items',  quiz:'questions', map:'tasks',   ear:'questions',
  drag:'items',  order:'rounds',   match:'rounds',
  react:'rounds', maze:'levels',   paint:'pics',
  colorq:'qs'   /* ★ v1.3.0 寵物調色工坊 */
};
function poolOf(x){
  var f = _POOL_FIELD[x.engine];
  var p = f ? x[f] : null;
  return (p && p.length) ? p : [];
}

function startGame(x){
  stopTimer();
  stopEngines();          /* ★ v1.1.0 必要:重玩或換一款遊戲時,上一局的迴圈必須先停 */
  MG.cur = x;
  MG.idx = 0; MG.score = 0; MG.right = 0; MG.combo = 0; MG.maxCombo = 0;
  /* ★ v1.3.1:迷宮 6 關是「由易到難」排好的(解法數 11→3),不打亂;其餘引擎照舊隨機 */
  MG.order = (x.engine === 'maze') ? poolOf(x).slice() : shuffle(poolOf(x));
  mgPauseReset();                                  /* ★ v1.4.0 */
  MG.startedAt = (new Date()).getTime();           /* ★ v1.4.0 本局用時起點(牆鐘,暫停照算) */
  hide('page-home'); hide('page-result'); show('page-play'); show('back-btn'); show('pause-btn');
  /* ★ v1.1.0 — 遊戲中把「🗺 回大作戰」收起來:誤觸就是整局作廢,
     而 iPad standalone 的 confirm() 有靜默失敗前例(主程式 v5.57.0 教訓),不能靠二次確認擋。
     玩家仍可「← 回選單」再按回大作戰,只多一步。 */
  hide('toapp-btn');
  /* ★ v1.3.0 — 每款專屬 BGM(1甲)+ 整頁場景背景 + 題卡橫幅(2丙) */
  bgmPlay(mgGameBgm(x));
  var _url = mgThumbUrl(x);
  mgSetScene(_url);
  var _bi = $('sb-img');
  if(_bi){ _bi.style.display = ''; if(_bi.getAttribute('src') !== _url) _bi.src = _url; }
  $('sb-name').textContent = x.icon + ' ' + tx(x.name);
  $('sb-story').textContent = x.story ? tx(x.story) : '';
  var _amb = $('sb-amb');
  if(_amb){
    if(x.amb){ _amb.style.display = ''; _amb.src = mgAssetUrl(x.amb) + '?v=' + MG_VER; }
    else{ _amb.removeAttribute('src'); _amb.style.display = 'none'; }
  }
  mgFxPreload();
  playSfx('sfx-enter', 0.4);
  renderQuestion(false);
  window.scrollTo(0, 0);
}

/* ★ v1.1.0 — 引擎的共同清理點。
   ⚠⚠ 這支**一定**要在每個離開遊戲畫面的路徑上被呼叫。⚠⚠
     反應點擊引擎跑的是 requestAnimationFrame 無限迴圈,不取消的話:
     玩家按「回選單」以後,那個迴圈**還在背景一直跑**,持續產生掉落物、
     持續讀 DOM、持續耗電,而且下一次開遊戲會有兩個迴圈同時跑 ⇒ 速度變兩倍。
     這種 bug 在畫面上看不出來(首頁一切正常),只會表現成「iPad 越玩越燙、越玩越慢」,
     幾乎不可能從症狀反推原因,所以在這裡寫死提醒。 */
function stopEngines(){
  if(_RC){
    if(_RC.raf) cancelAnimationFrame(_RC.raf);
    _RC = null;
  }
  var pd = $('paint-drag'); if(pd) pd.style.display = 'none';
  _PT = null; _MZ = null; _MC = null; _OD = null; _DG = null;
  _EAR = null;   /* ★ v1.4.0 聽音坊演奏／拍子狀態 */
}

function stopTimer(){ if(MG.timer){ clearInterval(MG.timer); MG.timer = null; } }
function startTimer(sec){
  stopTimer();
  MG.tleft = sec;
  MG.ttotal = sec;   /* ★ v1.4.0 記住總長,暫停後續跑同一條 */
  var bar = $('timebar');
  bar.classList.remove('low');
  bar.style.width = '100%';
  _ringPaint(100, sec);
  _timerRun();
}
/* ★ v1.4.0 — 倒數的實際 interval 抽出來:startTimer(重頭)與 mgResume(接著跑)共用,
   tleft 不重設 ⇒ 暫停多久都從停住的那一秒接下去。 */
function _timerRun(){
  stopTimer();
  var total = MG.ttotal || 1, bar = $('timebar');
  MG.timer = setInterval(function(){
    MG.tleft -= 0.1;
    if(MG.tleft < 0) MG.tleft = 0;
    var pct = (MG.tleft / total) * 100;
    bar.style.width = pct + '%';
    if(pct <= 30) bar.classList.add('low');
    _ringPaint(pct, MG.tleft);
    if(MG.tleft <= 0){ stopTimer(); onTimeout(); }
  }, 100);
}

/* ══════════════════════════════════════════════════════════
 *  ★ v1.4.0 — 暫停(老師需求③)
 *  - 右上「⏸ 暫停」只在遊戲中顯示;暫停 = 停倒數(interval 清掉、tleft 保留)+ 停掉落(rAF 取消、剩餘毫秒記住)
 *    + 暫停 BGM + 蓋上 #pausebox;繼續 = 反向接回。
 *  - ⚠ 本局用時 = 牆鐘 Date.now() − MG.startedAt,**刻意不扣掉暫停時間**(老師:避免按暫停慢慢查答案),
 *    結算頁的快手加成就吃這個數字;暫停畫面上的時鐘每秒跳動,讓學生看見時間還在走。
 *  - 每個離開遊戲畫面的路徑(startGame / mgHome / finishGame)都要 mgPauseReset(),否則遮罩會殘留。
 * ══════════════════════════════════════════════════════════ */
var _PZ = { on: false, hadTimer: false, reactLeft: 0, clockT: null };
window.mgPauseToggle = function(){ if(_PZ.on) mgResume(); else mgPause(); };
function mgPause(){
  if(_PZ.on) return;
  if($('page-play').classList.contains('hidden')) return;
  _PZ.on = true;
  _PZ.hadTimer = !!MG.timer;
  if(MG.timer){ clearInterval(MG.timer); MG.timer = null; }   /* 不走 stopTimer 語意:tleft 保留 */
  if(_RC){
    if(_RC.raf) cancelAnimationFrame(_RC.raf);
    _RC.raf = 0;
    _PZ.reactLeft = Math.max(0, _RC.endAt - (new Date()).getTime());
    _RC.paused = true;
  }
  try{ var a = _bgmCur ? $(_bgmCur) : null; if(a) a.pause(); }catch(e){}
  var pb = $('pause-btn'); if(pb){ pb.textContent = '▶ 繼續'; pb.classList.add('on'); }
  $('pausebox').classList.add('on');
  _pzClock();
  if(_PZ.clockT) clearInterval(_PZ.clockT);
  _PZ.clockT = setInterval(_pzClock, 1000);
  playSfx('sfx-tap', 0.3);
}
function mgResume(){
  if(!_PZ.on) return;
  _PZ.on = false;
  if(_PZ.clockT){ clearInterval(_PZ.clockT); _PZ.clockT = null; }
  $('pausebox').classList.remove('on');
  var pb = $('pause-btn'); if(pb){ pb.textContent = '⏸ 暫停'; pb.classList.remove('on'); }
  if(_PZ.hadTimer && !MG.answered && MG.tleft > 0) _timerRun();
  if(_RC && _RC.paused){
    _RC.paused = false;
    _RC.endAt = (new Date()).getTime() + _PZ.reactLeft;
    _RC.last = 0;
    _RC.raf = requestAnimationFrame(_reactTick);
  }
  if(_bgmOn && _bgmCur){ try{ var a = $(_bgmCur); if(a && a.paused) a.play()['catch'](function(){}); }catch(e){} }
  playSfx('sfx-tap', 0.3);
}
function mgPauseReset(){
  _PZ.on = false;
  if(_PZ.clockT){ clearInterval(_PZ.clockT); _PZ.clockT = null; }
  var pz = $('pausebox'); if(pz) pz.classList.remove('on');
  var pb = $('pause-btn'); if(pb){ pb.textContent = '⏸ 暫停'; pb.classList.remove('on'); }
}
function _pzClock(){
  var c = $('pz-clock'); if(!c) return;
  c.textContent = '⏱ ' + mgFmtTime(mgElapsedSec());
}
function mgElapsedSec(){ return MG.startedAt ? Math.max(0, ((new Date()).getTime() - MG.startedAt) / 1000) : 0; }
function mgFmtTime(sec){
  sec = Math.round(sec);
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
/* 本局「標準時間」= 每題倒數秒數加總(react 用各回合 sec、其他引擎可用 q.sec 覆寫);
   用時 ≤ 30% 標準 ⇒ +50%,達標準時間以上 ⇒ +0%,中間線性。 */
function mgParTime(x){
  var pool = MG.order || [], sum = 0, i, q;
  for(i = 0; i < pool.length; i++){
    q = pool[i];
    sum += (q && q.sec) ? q.sec : (x.time || 20);
  }
  return Math.max(10, sum);
}
function mgTimeBonusPct(elapsed, par){
  if(!par || par <= 0) return 0;
  var r = elapsed / par;
  if(r <= 0.3) return 50;
  if(r >= 1) return 0;
  return Math.round(50 * (1 - r) / 0.7);
}
/* ★ v1.3.0 — 倒數環:與 #timebar 同一個計時器餵值,不另開 setInterval。
   ⚠ conic-gradient 舊 iPad(iOS < 12.2)不支援 ⇒ 圓弧不畫、只剩底色 + 秒數,功能不受影響。 */
function _ringPaint(pct, sec){
  var r = $('timering'), n = $('tnum');
  if(!r) return;
  var col = (pct <= 30) ? '#e84040' : '#f0c060';
  r.style.background = 'conic-gradient(' + col + ' ' + pct + '%, rgba(255,255,255,.12) 0)';
  if(pct <= 30) r.classList.add('low'); else r.classList.remove('low');
  if(n) n.textContent = Math.ceil(sec);
}
function onTimeout(){
  if(MG.answered) return;
  MG.answered = true;
  MG.combo = 0;
  var q = MG.order[MG.idx];
  var why = q.why ? tx(q.why) : '';
  showFeedback(false, '⏰ 時間到了!', why);
  lockOptions(-1);
  try{ _earReveal(); }catch(e){}   /* ★ v1.4.0 聽音坊演奏／拍子題超時揭曉正解 */
}

/* ── 題目渲染(四引擎共用外框)────────────────────────── */
function renderQuestion(keepState){
  var x = MG.cur; if(!x) return;
  var q = MG.order[MG.idx];
  if(!keepState){ MG.answered = false; }

  $('progress').textContent = (MG.idx + 1) + ' / ' + MG.order.length;
  $('score').textContent = MG.score + ' 分';
  $('combo').textContent = MG.combo >= 2 ? ('🔥 ' + MG.combo + ' 連') : '';

  /* ★ v1.1.0 — 容器顯隱收攏成一份清單。
     舊寫法是逐個 hide(),每加一個引擎就要記得補一行,漏掉的症狀是
     「玩完 A 遊戲再玩 B,上一款的畫面還黏在下面」——很難聯想到原因。 */
  var _BOXES = ['mapbox','earbox','dragbox','orderbox','matchbox',
                'reactbox','react-hud','mazebox','paintbox','colorqbox'];
  for(var _b = 0; _b < _BOXES.length; _b++) hide(_BOXES[_b]);

  if(x.engine === 'sort') renderSort(x, q);
  else if(x.engine === 'quiz') renderQuiz(x, q);
  else if(x.engine === 'map') renderMap(x, q);
  else if(x.engine === 'ear') renderEar(x, q);
  else if(x.engine === 'drag') renderDrag(x, q);
  else if(x.engine === 'order') renderOrder(x, q);
  else if(x.engine === 'match') renderMatch(x, q);
  else if(x.engine === 'react') renderReact(x, q);
  else if(x.engine === 'maze') renderMaze(x, q);
  else if(x.engine === 'paint') renderPaint(x, q);
  else if(x.engine === 'colorq') renderColorq(x, q);   /* ★ v1.3.0 */

  /* ⚠ react 自己跑掉落迴圈、maze 與 paint 是慢慢想的關卡型玩法,
     三者都由各自的 render 決定計時方式,不吃這裡的統一倒數。 */

  if(!keepState && x.engine !== 'react') startTimer((q && q.sec) ? q.sec : x.time);
}

/* ── 引擎 C2:聽音辨曲(Web Audio 即時合成,零音檔)──── */
/* ══════════════════════════════════════════════════════════
 *  引擎 C(v1.4.0 大改・老師需求①「聽音坊太單調」):
 *    舊題型 hilo/dir/same/count/penta(選擇題)完整保留;
 *    新增 song(聽旋律猜歌名・選擇題)/ play(聽音演奏:聽完用動物琴鍵彈回來)
 *          / score(經典旋律:看簡譜跟著彈,不判拍子只判順序)/ rhythm(模仿拍子:聽鼓聲後照拍子敲鼓)。

 *  ★ seq 可寫頻率(舊題)或音名字串('do','re',…,'do2'),_earFreq 統一轉頻率。
 *  ★ 所有聲音由 WebAudio 即時合成(零音檔),gain × _mgVolSfx 受音效拉桿控制。
 * ══════════════════════════════════════════════════════════ */
var EAR_NOTES = [
  { k:'do',  sf:'Do',  pn:'C', hz:261.63, ani:'🐱' },
  { k:'re',  sf:'Re',  pn:'D', hz:293.66, ani:'🐶' },

  { k:'fa',  sf:'Fa',  pn:'F', hz:349.23, ani:'🐰' },
  { k:'sol', sf:'Sol', pn:'G', hz:392.00, ani:'🐷' },
  { k:'la',  sf:'La',  pn:'A', hz:440.00, ani:'🐔' },
  { k:'si',  sf:'Si',  pn:'B', hz:493.88, ani:'🐵' },

function _earCtx(){

  if(!AC) return null;

/* 鋼琴感音色:三角波基音 + 正弦高八度,快起慢落 */
function _earTone(ctx, freq, st, dur){
  if(_mgVolSfx <= 0) return;
  var g = ctx.createGain(), o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g2 = ctx.createGain();
  dur = dur || 0.5;
  o1.type = 'triangle'; o1.frequency.value = freq;
  o2.type = 'sine'; o2.frequency.value = freq * 2; g2.gain.value = 0.25;
  g.gain.setValueAtTime(0.0001, st);
  g.gain.linearRampToValueAtTime(0.26 * _mgVolSfx, st + 0.02);
  g.gain.exponentialRampToValueAtTime(0.12 * _mgVolSfx, st + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(ctx.destination);
  o1.start(st); o2.start(st); o1.stop(st + dur + 0.02); o2.stop(st + dur + 0.02);

/* 鼓聲:低頻正弦下滑 + 一小撮噪音 */
function _earDrum(ctx, st){
  if(_mgVolSfx <= 0) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(180, st);
  o.frequency.exponentialRampToValueAtTime(55, st + 0.14);
  g.gain.setValueAtTime(0.7 * _mgVolSfx, st);
  g.gain.exponentialRampToValueAtTime(0.0001, st + 0.22);
  o.connect(g); g.connect(ctx.destination);
  o.start(st); o.stop(st + 0.25);
  try{
    var n = ctx.createBufferSource(), buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.06), ctx.sampleRate), d = buf.getChannelData(0), i;
    for(i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    var ng = ctx.createGain(); ng.gain.value = 0.18 * _mgVolSfx;
    n.buffer = buf; n.connect(ng); ng.connect(ctx.destination); n.start(st);
  }catch(e){}
}

window.mgDrumTap = function(ev){

  _earDrum(ctx, ctx.currentTime + 0.005);
  var pad = $('dr-pad'); if(pad){ pad.classList.add('hit'); setTimeout(function(){ pad.classList.remove('hit'); }, 90); }
  var pat = _EAR.q.pattern || [];

/* 判定:拍數要一樣;各拍「間隔比例」與目標比例相差 ≤ 45% 算對(速度快慢不管,只看節奏)。
   對小學生:只要拍數對、長短拍分得出來就過;每一拍逐一標綠/紅讓他知道哪一下不對。 */
function _earJudgeRhythm(){
  if(!_EAR || _EAR.done || MG.answered) return;
  var q = _EAR.q, pat = q.pattern || [], taps = _EAR.taps, i, ok = true, judge = [];
  if(pat.length < 2){ ok = taps.length === pat.length; judge = [ok]; }
  else{
    var tSum = 0, mSum = 0;
    for(i = 0; i < pat.length - 1; i++){ tSum += pat[i]; mSum += (taps[i + 1] - taps[i]); }
    judge.push(true);   /* 第一下永遠是對的(起拍) */
    for(i = 0; i < pat.length - 1; i++){
      var tr = pat[i] / tSum, mr = (taps[i + 1] - taps[i]) / (mSum || 1);
      var good = Math.abs(mr - tr) <= tr * 0.45;
      judge.push(good); if(!good) ok = false;
    }
  }
  _EAR.done = true; _EAR.judge = judge;
  MG.answered = true; stopTimer();
  _earPaintBeats();
  var nOk = 0; for(i = 0; i < judge.length; i++) if(judge[i]) nOk++;
  scoreIt(ok);
  showFeedback(ok, ok ? '✅ 拍子一模一樣!' : ('❌ 有 ' + (judge.length - nOk) + ' 拍節奏不對(紅色那幾拍)'), q.why ? tx(q.why) : '');
}
/* 超時揭曉:琴鍵題把正解列出來、拍子題把拍點全標紅 */

}
window.mgEarPlay = function(){

        })(i, t0 + acc);
