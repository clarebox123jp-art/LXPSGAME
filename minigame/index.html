<!-- ============================================================================
     小英雄小遊戲 — 獨立 PWA(minigame/index.html)v1.0.0(2026-09-03)
     ★ 與主程式 index.html 完全分離:不引用主程式任何 JS/CSS/全域變數/localStorage 鍵。
     ★ 存在目的(老師需求):平板老舊、校網太差而開不動「小英雄大對抗」的學生,
       至少能秒開這個小程式來玩 ⇒ 首載只有本檔 + minigame_db.js,無框架、無外部字型。
     ★ Firebase SDK 只在按「登入」時才動態載入(compat 版),不登入完全不碰網路。
     ★ 全 ES5:沒有 ?. ?? 箭頭函式 樣板字串 let/const,舊 iPad Safari 直接跑。
     ★ 共用平板:未登入的成績只留在記憶體(關掉就沒了);登入使用獨立 app 名稱 +
       SESSION persistence ⇒ 讀不到主程式殘留 token、關 App 即忘。
     ★ 雲端:同一個 Firebase 專案 lxpsgame、同一個 Google 帳號 ⇒ uid 相同,
       只寫 minigameScores/{uid},絕不碰 players/ 存檔。
     ★ 鐵律 1.232:所有解說文字都有 簡單風(s)/精緻風(f) 兩版,右上角「字」鈕即時切換。
     ============================================================================ -->
<style>
:root{
  --ink:#123024;        /* 深墨綠 底色 */
  --ink2:#1b4433;       /* 次深綠 */
  --tea:#2f7355;        /* 茶山綠 */
  --mist:#d9ece2;       /* 山嵐白 主文字 */
  --paper:#f8f3e6;      /* 米紙 卡片 */
  --sun:#f2a83c;        /* 夕陽橘 主要行動 */
  --gold:#ffd166;       /* 金 星星 */
  --brick:#d2543f;      /* 磚紅 錯誤 */
  --grass:#4fbf7d;      /* 草綠 正確 */
  --shadow:0 6px 0 rgba(0,0,0,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  background:var(--ink);
  background-image:
    radial-gradient(circle at 20% 0%,rgba(79,191,125,.13),transparent 55%),
    radial-gradient(circle at 85% 12%,rgba(242,168,60,.10),transparent 50%);
  color:var(--mist);
  font-family:"PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  font-size:17px;line-height:1.65;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
.wrap{max-width:820px;margin:0 auto;padding:10px 14px 40px;}
button,.btn{
  font-family:inherit;font-size:17px;font-weight:700;color:#3a2a10;
  background:var(--sun);border:0;border-radius:14px;
  padding:13px 18px;min-height:48px;cursor:pointer;
  box-shadow:var(--shadow);touch-action:manipulation;
}
button:active,.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.28);}
button[disabled]{opacity:.45;}
.btn-ghost{background:transparent;color:var(--mist);border:2px solid rgba(217,236,226,.35);box-shadow:none;}
.btn-ghost:active{transform:translateY(2px);}
.hidden{display:none !important;}

/* ── 頂列 ───────────────────────────────── */
#topbar{display:flex;align-items:center;gap:8px;padding:6px 2px 2px;min-height:46px;}
#topbar .grow{flex:1;}
.chip{
  font-size:14px;font-weight:700;padding:7px 12px;border-radius:999px;min-height:38px;
  background:rgba(255,255,255,.10);color:var(--mist);border:1px solid rgba(217,236,226,.22);
  box-shadow:none;
}
#who{font-size:14px;opacity:.9;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── 首頁 ───────────────────────────────── */
#title-img{display:block;width:100%;max-width:560px;margin:2px auto 0;}
#title-fallback{display:none;text-align:center;font-size:30px;font-weight:900;color:var(--gold);margin:10px 0;}
.sub{text-align:center;font-size:15px;opacity:.85;margin:0 0 14px;}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.cell{
  position:relative;background:linear-gradient(180deg,var(--ink2),#16382a);
  border:2px solid rgba(217,236,226,.16);border-radius:18px;
  padding:12px 6px 10px;text-align:center;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.3);touch-action:manipulation;min-height:118px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
.cell:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3);}
.cell .ce{font-size:34px;line-height:1.1;}
.cell .cn{font-size:15px;font-weight:800;color:var(--mist);}
.cell .cs{font-size:11px;opacity:.7;}
.cell .cstar{font-size:12px;color:var(--gold);min-height:16px;letter-spacing:1px;}
.cell .cbest{position:absolute;top:6px;right:8px;font-size:11px;opacity:.75;}

/* ── 遊戲畫面 ───────────────────────────── */
#hud{display:flex;align-items:center;gap:10px;margin:6px 0 10px;flex-wrap:wrap;}
.stat{background:rgba(255,255,255,.09);border-radius:12px;padding:6px 12px;font-size:15px;font-weight:700;}
#combo{color:var(--gold);}
#timebar-wrap{height:10px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin-bottom:12px;}
#timebar{height:100%;width:100%;background:linear-gradient(90deg,var(--grass),var(--gold));transition:width .25s linear;}
#timebar.low{background:linear-gradient(90deg,var(--brick),#f2a83c);}

.card{
  background:var(--paper);color:#2b2b2b;border-radius:18px;padding:18px 16px;
  font-size:19px;line-height:1.7;font-weight:600;box-shadow:0 5px 0 rgba(0,0,0,.25);
  min-height:96px;display:flex;align-items:center;justify-content:center;text-align:center;
}
#qhint{font-size:14px;text-align:center;opacity:.85;margin:8px 0 0;}
.opts{display:grid;gap:10px;margin-top:14px;}
.opts.two{grid-template-columns:1fr 1fr;}
.opts.three{grid-template-columns:repeat(3,1fr);}
.opt{
  background:var(--ink2);color:var(--mist);border:2px solid rgba(217,236,226,.25);
  border-radius:16px;padding:14px 10px;font-size:17px;font-weight:700;min-height:58px;
  box-shadow:0 4px 0 rgba(0,0,0,.28);
}
.opt .oe{display:block;font-size:26px;line-height:1.2;}
.opt.ok{background:var(--grass);color:#0d2a18;border-color:var(--grass);}
.opt.ng{background:var(--brick);color:#fff;border-color:var(--brick);}
#feedback{
  margin-top:14px;border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.7;
  background:rgba(255,255,255,.10);border-left:6px solid var(--gold);display:none;
}
#feedback.show{display:block;}
#feedback b{color:var(--gold);}
#feedback.ok{border-left-color:var(--grass);}
#feedback.ng{border-left-color:var(--brick);}
#nextrow{display:flex;gap:10px;margin-top:14px;}
#nextrow button{flex:1;}

/* ── 地圖引擎 ───────────────────────────── */
#mapbox{background:rgba(255,255,255,.06);border-radius:18px;padding:8px;margin-top:12px;}
#tw-svg{display:block;width:100%;height:auto;max-height:56vh;}
.spot{fill:rgba(217,236,226,.30);stroke:rgba(255,255,255,.5);stroke-width:.7;cursor:pointer;}
.spot.ok{fill:var(--grass);}
.spot.ng{fill:var(--brick);}
.spot.reveal{fill:var(--gold);stroke:#fff;stroke-width:1.4;}
.spotlbl{font-size:4.6px;fill:#eaf5ef;pointer-events:none;text-anchor:middle;font-weight:700;}

/* ── 聽音引擎 ───────────────────────────── */
#playbtn{display:block;margin:14px auto 0;font-size:20px;padding:16px 34px;}
#playnote{text-align:center;font-size:14px;opacity:.8;margin-top:8px;}

/* ── 結算 ───────────────────────────────── */
#result{text-align:center;padding-top:6px;}
#result .big{font-size:52px;font-weight:900;color:var(--gold);line-height:1.2;}
#result .stars{font-size:38px;letter-spacing:6px;color:var(--gold);margin:6px 0;}
#result .line{font-size:16px;opacity:.9;margin:4px 0;}
#result .newbest{color:var(--grass);font-weight:800;font-size:18px;margin-top:6px;}

/* ── 說明彈窗 ───────────────────────────── */
#modal{
  position:fixed;inset:0;background:rgba(5,15,11,.82);z-index:80;
  display:none;align-items:center;justify-content:center;padding:18px;
}
#modal.show{display:flex;}
#modal .box{
  background:var(--ink2);border:2px solid rgba(217,236,226,.22);border-radius:20px;
  padding:20px 18px;max-width:520px;width:100%;max-height:82vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
#modal h3{margin:0 0 4px;font-size:21px;color:var(--gold);}
#modal .tag{font-size:13px;opacity:.75;margin-bottom:12px;}
#modal .sec{margin:12px 0;}
#modal .sec b{display:block;font-size:14px;color:var(--gold);margin-bottom:2px;}
#modal .row{display:flex;gap:10px;margin-top:16px;}
#modal .row button{flex:1;}

/* 提示條 */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:rgba(0,0,0,.86);color:#fff;padding:11px 18px;border-radius:999px;
  font-size:15px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;}

/* 小螢幕 */
@media (max-width:390px){
  body{font-size:16px;}
  .cell{min-height:104px;padding:10px 4px;}
  .cell .ce{font-size:29px;}
  .cell .cn{font-size:13px;}
  .card{font-size:17px;padding:15px 12px;}
  .opt{font-size:15px;padding:12px 6px;}
}
</style>
</head>

<script>
/* ============================================================================
 * 小英雄小遊戲 — 主程式邏輯 v1.0.0
 * 全 ES5:無 ?. / ?? / 箭頭 / 樣板字串 / let / const,舊 iPad Safari 直接跑。
 * ============================================================================ */
(function(){
'use strict';

var MG_VER = 'v1.0.0';

/* ── 全域狀態 ────────────────────────────────────────────── */
var MG = {
  style : 'f',    // 'f' 精緻風 / 's' 簡單風(鐵律 1.232 雙版文案)
  games : [],
  cur   : null,   // 目前遊戲資料
  order : [],     // 本局題序
  idx   : 0,
  score : 0,
  right : 0,
  combo : 0,
  maxCombo : 0,
  answered : false,
  timer : null,
  tleft : 0,
  best  : {},     // { gameId: {score,stars,acc} } — 未登入時只活在記憶體
  user  : null,
  fb    : null,   // { app, auth, db }
  fbLoading : false,
  audioCtx : null,
  pendingGame : null
};

/* ── 小工具 ──────────────────────────────────────────────── */
function $(id){ return document.getElementById(id); }
function show(id){ var e=$(id); if(e) e.classList.remove('hidden'); }
function hide(id){ var e=$(id); if(e) e.classList.add('hidden'); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
/* 依目前字體風格取雙版文字;只給字串時直接回傳 */
function tx(o){
  if(o == null) return '';
  if(typeof o === 'string') return o;
  var v = o[MG.style];
  if(v == null) v = (o.f != null ? o.f : o.s);
  return v == null ? '' : v;
}
function playSfx(id, vol){
  try{
    var a = $(id); if(!a) return;
    a.currentTime = 0;
    a.volume = (vol == null ? 0.55 : vol);
    var p = a.play();
    if(p && p['catch']) p['catch'](function(){});
  }catch(e){}
}
var _toastT = null;
function toast(msg){
  var t = $('toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  if(_toastT) clearTimeout(_toastT);
  _toastT = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function shuffle(arr){
  var a = arr.slice(), i, j, t;
  for(i = a.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ── 標題圖後備(webp → png → 純文字)──────────────────── */
window.mgTitleFallback = function(img){
  if(img.getAttribute('data-fb') !== '1'){
    img.setAttribute('data-fb','1');
    img.src = 'title.png';
    return;
  }
  img.style.display = 'none';
  var f = $('title-fallback'); if(f) f.style.display = 'block';
};

/* ── 字體風格切換(簡單風／精緻風)────────────────────── */
window.mgToggleStyle = function(){
  MG.style = (MG.style === 'f' ? 's' : 'f');
  try{ localStorage.setItem('mg_style', MG.style); }catch(e){}
  $('style-btn').textContent = (MG.style === 'f' ? '字' : '字ᐟ');
  toast(MG.style === 's' ? '已切換:簡單說明' : '已切換:完整說明');
  playSfx('sfx-tap', 0.35);
  // 即時重繪目前畫面
  renderGrid();
  // ⚠ 已作答的題目不重繪:重繪會清掉解說與正解標示,下一題自然會套用新字體
  if(!$('page-play').classList.contains('hidden') && !MG.answered) renderQuestion(true);
  if($('modal').classList.contains('show') && MG.pendingGame) openInfo(MG.pendingGame, false);
};

/* ══════════════════════════════════════════════════════════
 *  首頁九宮格
 * ══════════════════════════════════════════════════════════ */
function renderGrid(){
  var g = $('grid'); if(!g) return;
  var html = '', i, x, b, stars;
  for(i = 0; i < MG.games.length; i++){
    x = MG.games[i];
    b = MG.best[x.id];
    stars = b ? new Array(b.stars + 1).join('★') : '';
    html += '<div class="cell" onclick="mgOpenInfo(\'' + x.id + '\')">'
          +   (b ? '<span class="cbest">' + b.score + '</span>' : '')
          +   '<span class="ce">' + x.icon + '</span>'
          +   '<span class="cn">' + esc(tx(x.name)) + '</span>'
          +   '<span class="cs">' + esc(x.subject.split(' · ')[0]) + '</span>'
          +   '<span class="cstar">' + stars + '</span>'
          + '</div>';
  }
  g.innerHTML = html;
}

window.mgOpenInfo = function(id){
  playSfx('sfx-tap', 0.4);
  var i, x = null;
  for(i = 0; i < MG.games.length; i++){ if(MG.games[i].id === id) x = MG.games[i]; }
  if(!x) return;
  openInfo(x, true);
};
function openInfo(x, withSfx){
  MG.pendingGame = x;
  $('m-name').textContent = x.icon + ' ' + tx(x.name);
  $('m-subject').textContent = x.subject;
  $('m-goal').textContent = tx(x.goal);
  $('m-how').textContent = tx(x.how);
  var b = MG.best[x.id];
  $('m-best').textContent = b
    ? (b.score + ' 分 · ' + new Array(b.stars + 1).join('★') + ' · 答對率 ' + b.acc + '%')
    : '還沒有紀錄,來挑戰看看!';
  $('modal').classList.add('show');
  if(withSfx) playSfx('sfx-tap', 0.3);
}
window.mgShowInfo = function(){ if(MG.cur) openInfo(MG.cur, true); };
window.mgCloseInfo = function(){ $('modal').classList.remove('show'); };
window.mgStartFromModal = function(){
  $('modal').classList.remove('show');
  if(MG.pendingGame) startGame(MG.pendingGame);
};

/* ══════════════════════════════════════════════════════════
 *  一局的流程
 * ══════════════════════════════════════════════════════════ */
function startGame(x){
  MG.cur = x;
  MG.idx = 0; MG.score = 0; MG.right = 0; MG.combo = 0; MG.maxCombo = 0;
  var pool = (x.engine === 'sort') ? x.items : (x.engine === 'map' ? x.tasks : x.questions);
  MG.order = shuffle(pool);
  hide('page-home'); hide('page-result'); show('page-play'); show('back-btn');
  playSfx('sfx-enter', 0.4);
  renderQuestion(false);
  window.scrollTo(0, 0);
}
window.mgRetry = function(){ if(MG.cur) startGame(MG.cur); };
window.mgHome = function(){
  stopTimer();
  MG.cur = null;
  hide('page-play'); hide('page-result'); hide('back-btn'); show('page-home');
  renderGrid();
  window.scrollTo(0, 0);
};

function stopTimer(){ if(MG.timer){ clearInterval(MG.timer); MG.timer = null; } }
function startTimer(sec){
  stopTimer();
  MG.tleft = sec;
  var total = sec, bar = $('timebar');
  bar.classList.remove('low');
  bar.style.width = '100%';
  MG.timer = setInterval(function(){
    MG.tleft -= 0.1;
    if(MG.tleft < 0) MG.tleft = 0;
    var pct = (MG.tleft / total) * 100;
    bar.style.width = pct + '%';
    if(pct <= 30) bar.classList.add('low');
    if(MG.tleft <= 0){ stopTimer(); onTimeout(); }
  }, 100);
}
function onTimeout(){
  if(MG.answered) return;
  MG.answered = true;
  MG.combo = 0;
  var q = MG.order[MG.idx];
  var why = q.why ? tx(q.why) : '';
  showFeedback(false, '⏰ 時間到了!', why);
  lockOptions(-1);
}

/* ── 題目渲染(四引擎共用外框)────────────────────────── */
function renderQuestion(keepState){
  var x = MG.cur; if(!x) return;
  var q = MG.order[MG.idx];
  if(!keepState){ MG.answered = false; }

  $('progress').textContent = (MG.idx + 1) + ' / ' + MG.order.length;
  $('score').textContent = MG.score + ' 分';
  $('combo').textContent = MG.combo >= 2 ? ('🔥 ' + MG.combo + ' 連') : '';

  hide('mapbox'); hide('earbox'); show('card-area');
  $('feedback').className = ''; $('feedback').classList.remove('show');
  hide('nextrow');
  $('qhint').textContent = x.hint ? tx(x.hint) : '';

  if(x.engine === 'sort') renderSort(x, q);
  else if(x.engine === 'quiz') renderQuiz(x, q);
  else if(x.engine === 'map') renderMap(x, q);
  else if(x.engine === 'ear') renderEar(x, q);

  if(!keepState) startTimer(x.time);
}

/* ── 引擎 A:分類衝刺 ───────────────────────────────── */
function renderSort(x, it){
  $('qcard').textContent = it.t;
  var o = $('opts'), html = '', i, b;
  o.className = 'opts ' + (x.bins.length === 2 ? 'two' : 'three');
  for(i = 0; i < x.bins.length; i++){
    b = x.bins[i];
    html += '<button class="opt" data-i="' + i + '" onclick="mgAnswer(' + i + ')">'
          +   '<span class="oe">' + b.e + '</span>' + esc(b.n)
          + '</button>';
  }
  o.innerHTML = html;
}

/* ── 引擎 B:情境選擇題 ─────────────────────────────── */
function renderQuiz(x, q){
  $('qcard').textContent = tx(q.q);
  var o = $('opts'), html = '', i;
  o.className = 'opts';
  for(i = 0; i < q.o.length; i++){
    html += '<button class="opt" data-i="' + i + '" onclick="mgAnswer(' + i + ')">'
          + esc(q.o[i]) + '</button>';
  }
  o.innerHTML = html;
}

/* ── 引擎 C1:台灣地圖點位 ──────────────────────────── */
function renderMap(x, t){
  $('qcard').textContent = tx(t.q);
  $('opts').innerHTML = '';
  show('mapbox');
  var s = '<svg id="tw-svg" viewBox="0 0 90 130" xmlns="http://www.w3.org/2000/svg">'
        + '<path d="M52 8 L60 12 L64 20 L66 30 L67 42 L64 56 L61 70 L57 84 L51 100 L46 114 '
        + 'L42 121 L37 114 L32 100 L28 86 L25 70 L26 55 L29 42 L34 30 L41 18 L47 11 Z" '
        + 'fill="rgba(79,191,125,.18)" stroke="rgba(217,236,226,.55)" stroke-width="1"/>'
        + '<ellipse cx="11" cy="82" rx="5" ry="6" fill="rgba(79,191,125,.18)" '
        + 'stroke="rgba(217,236,226,.5)" stroke-width=".8"/>';
  var i, sp;
  for(i = 0; i < x.spots.length; i++){
    sp = x.spots[i];
    s += '<circle class="spot" id="sp-' + sp.id + '" cx="' + sp.x + '" cy="' + sp.y + '" r="4.2" '
       + 'onclick="mgAnswerMap(\'' + sp.id + '\')"></circle>'
       + '<text class="spotlbl" x="' + sp.x + '" y="' + (sp.y + 1.6) + '">' + sp.n + '</text>';
  }
  s += '</svg>';
  $('mapbox').innerHTML = s;
}

/* ── 引擎 C2:聽音辨曲(Web Audio 即時合成,零音檔)──── */
function renderEar(x, q){
  $('qcard').textContent = tx(q.q);
  show('earbox');
  var o = $('opts'), html = '', i;
  o.className = 'opts ' + (q.o.length === 2 ? 'two' : (q.o.length === 3 ? 'three' : ''));
  for(i = 0; i < q.o.length; i++){
    html += '<button class="opt" data-i="' + i + '" onclick="mgAnswer(' + i + ')">'
          + esc(q.o[i]) + '</button>';
  }
  o.innerHTML = html;
}
window.mgEarPlay = function(){
  var q = MG.order[MG.idx];
  if(!q || !q.seq) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ toast('這台裝置不支援音效,請改玩其他關卡'); return; }
    if(!MG.audioCtx) MG.audioCtx = new AC();
    if(MG.audioCtx.state === 'suspended' && MG.audioCtx.resume) MG.audioCtx.resume();
    var ctx = MG.audioCtx, t0 = ctx.currentTime + 0.05, i;
    for(i = 0; i < q.seq.length; i++){
      (function(freq, k){
        var osc = ctx.createOscillator(), g = ctx.createGain();
        var st = t0 + k * 0.62;
        osc.type = 'sine';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, st);
        g.gain.linearRampToValueAtTime(0.22, st + 0.04);
        g.gain.linearRampToValueAtTime(0.16, st + 0.36);
        g.gain.linearRampToValueAtTime(0.0001, st + 0.52);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(st); osc.stop(st + 0.56);
      })(q.seq[i], i);
    }
  }catch(e){ toast('播放失敗,請再試一次'); }
};

/* ── 作答判定 ───────────────────────────────────────── */
window.mgAnswer = function(i){
  if(MG.answered) return;
  var x = MG.cur, q = MG.order[MG.idx], correct, ansIdx;
  if(x.engine === 'sort'){
    var ci = -1, k;
    for(k = 0; k < x.bins.length; k++){ if(x.bins[k].id === q.b) ci = k; }
    ansIdx = ci;
  }else{
    ansIdx = q.a;
  }
  correct = (i === ansIdx);
  finishAnswer(correct, ansIdx, q);
};
window.mgAnswerMap = function(spotId){
  if(MG.answered) return;
  var q = MG.order[MG.idx];
  var correct = (spotId === q.a);
  MG.answered = true; stopTimer();
  var el = $('sp-' + spotId);
  if(el) el.setAttribute('class', 'spot ' + (correct ? 'ok' : 'ng'));
  if(!correct){
    var right = $('sp-' + q.a);
    if(right) right.setAttribute('class', 'spot reveal');
  }
  scoreIt(correct);
  showFeedback(correct, correct ? '✅ 答對了!' : '❌ 正確位置已標出來', tx(q.why));
};

function finishAnswer(correct, ansIdx, q){
  MG.answered = true;
  stopTimer();
  lockOptions(ansIdx, correct ? ansIdx : -2);
  scoreIt(correct);
  showFeedback(correct, correct ? '✅ 答對了!' : '❌ 再想想看', q.why ? tx(q.why) : '');
}
function lockOptions(ansIdx, _sel){
  var btns = $('opts').getElementsByTagName('button'), i, di;
  for(i = 0; i < btns.length; i++){
    btns[i].disabled = true;
    di = parseInt(btns[i].getAttribute('data-i'), 10);
    if(di === ansIdx) btns[i].className = 'opt ok';
  }
}
function scoreIt(correct){
  if(correct){
    MG.right++;
    MG.combo++;
    if(MG.combo > MG.maxCombo) MG.maxCombo = MG.combo;
    var bonus = Math.min(MG.combo - 1, 5) * 20;
    var timeB = Math.round(MG.tleft * 2);
    MG.score += 100 + bonus + timeB;
    playSfx(MG.combo >= 3 ? 'sfx-coin' : 'sfx-ok', 0.5);
  }else{
    MG.combo = 0;
    playSfx('sfx-ng', 0.4);
  }
  $('score').textContent = MG.score + ' 分';
  $('combo').textContent = MG.combo >= 2 ? ('🔥 ' + MG.combo + ' 連') : '';
}
function showFeedback(ok, head, why){
  var f = $('feedback');
  f.className = 'feedback show ' + (ok ? 'ok' : 'ng');
  f.classList.add('show');
  f.innerHTML = '<b>' + esc(head) + '</b><br>' + esc(why);
  var nr = $('nextrow');
  nr.classList.remove('hidden');
  nr.getElementsByTagName('button')[0].textContent =
    (MG.idx >= MG.order.length - 1) ? '看成績 →' : '下一題 →';
}
window.mgNext = function(){
  playSfx('sfx-tap', 0.3);
  if(MG.idx >= MG.order.length - 1){ finishGame(); return; }
  MG.idx++;
  renderQuestion(false);
  window.scrollTo(0, 0);
};

/* ── 結算 ───────────────────────────────────────────── */
function finishGame(){
  stopTimer();
  var total = MG.order.length;
  var acc = Math.round((MG.right / total) * 100);
  var stars = acc >= 90 ? 3 : (acc >= 70 ? 2 : (acc >= 50 ? 1 : 0));
  hide('page-play'); show('page-result');

  $('r-name').textContent = MG.cur.icon + ' ' + tx(MG.cur.name);
  $('r-stars').textContent = stars > 0 ? new Array(stars + 1).join('★') : '☆';
  $('r-score').textContent = MG.score + ' 分';
  $('r-detail').textContent = '答對 ' + MG.right + ' / ' + total
                            + ' 題(' + acc + '%) · 最高連擊 ' + MG.maxCombo;

  var prev = MG.best[MG.cur.id];
  var isNew = (!prev || MG.score > prev.score);
  if(isNew){
    MG.best[MG.cur.id] = { score: MG.score, stars: stars, acc: acc };
    show('r-newbest');
    playSfx('sfx-clap', 0.5);
  }else{
    hide('r-newbest');
    playSfx('sfx-coin', 0.4);
  }

  if(MG.user && isNew){
    $('r-cloud').textContent = '☁ 存到雲端中…';
    saveCloud(MG.cur.id, MG.best[MG.cur.id]);
  }else if(MG.user){
    $('r-cloud').textContent = '☁ 這次沒有超過最佳成績,雲端保持原紀錄';
  }else{
    $('r-cloud').textContent = '目前沒有登入,成績只留在這一次(關掉就不見)';
  }
  window.scrollTo(0, 0);
}

/* ══════════════════════════════════════════════════════════
 *  Firebase — 只在按「登入」時才動態載入
 *  ★ 獨立 app 名稱 'minigame' + SESSION persistence:
 *    讀不到主程式殘留 token、關掉 App 就忘記 ⇒ 共用平板不會記到別人頭上。
 *  ★ 只寫 minigameScores/{uid},絕不碰 players/。
 * ══════════════════════════════════════════════════════════ */
var FB_CFG = {
  apiKey: "AIzaSyDTsWozvDMoJyDhPmiYi1QZ31rlyy7fxZc",
  authDomain: "lxpsgame.firebaseapp.com",
  projectId: "lxpsgame",
  storageBucket: "lxpsgame.firebasestorage.app",
  messagingSenderId: "887017862215",
  appId: "1:887017862215:web:7f6248ec2e5684cf63ed62"
};
var FB_BASE = 'https://www.gstatic.com/firebasejs/10.12.0/';

function loadScript(url){
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = url; s.async = true;
    s.onload = function(){ res(); };
    s.onerror = function(){ rej(new Error('load fail: ' + url)); };
    document.head.appendChild(s);
  });
}
function ensureFirebase(){
  if(MG.fb) return Promise.resolve(MG.fb);
  if(MG.fbLoading) return Promise.reject(new Error('loading'));
  MG.fbLoading = true;
  toast('連線中,請稍等…');
  return loadScript(FB_BASE + 'firebase-app-compat.js')
    .then(function(){ return loadScript(FB_BASE + 'firebase-auth-compat.js'); })
    .then(function(){ return loadScript(FB_BASE + 'firebase-firestore-compat.js'); })
    .then(function(){
      var app = window.firebase.initializeApp(FB_CFG, 'minigame');
      var auth = window.firebase.auth(app);
      var db = window.firebase.firestore(app);
      MG.fb = { app: app, auth: auth, db: db };
      MG.fbLoading = false;
      try{ auth.setPersistence(window.firebase.auth.Auth.Persistence.SESSION); }catch(e){}
      auth.onAuthStateChanged(function(u){ onUser(u); });
      return MG.fb;
    })['catch'](function(e){
      MG.fbLoading = false;
      toast('連線失敗,不過不影響玩遊戲');
      throw e;
    });
}
window.mgLoginTap = function(){
  playSfx('sfx-tap', 0.35);
  if(MG.user){
    if(confirm('要登出嗎?登出後成績就不會存到雲端。')){
      if(MG.fb) MG.fb.auth.signOut();
    }
    return;
  }
  ensureFirebase().then(function(fb){
    var prov = new window.firebase.auth.GoogleAuthProvider();
    prov.setCustomParameters({ prompt: 'select_account' });
    return fb.auth.signInWithPopup(prov)['catch'](function(err){
      // iPad standalone 常擋 popup ⇒ 退回 redirect
      return fb.auth.signInWithRedirect(prov);
    });
  })['catch'](function(e){ /* ensureFirebase 內已提示 */ });
};
function onUser(u){
  MG.user = u || null;
  var btn = $('login-btn'), who = $('who');
  if(u){
    btn.textContent = '登出';
    who.textContent = (u.displayName || u.email || '已登入');
    loadCloud();
  }else{
    btn.textContent = '登入';
    who.textContent = '';
  }
}
function loadCloud(){
  if(!MG.fb || !MG.user) return;
  MG.fb.db.collection('minigameScores').doc(MG.user.uid).get().then(function(snap){
    if(!snap.exists) return;
    var d = snap.data() || {}, g = d.games || {}, k;
    // ★ 合併規則:兩邊取「分數較高者」,絕不用雲端的低分覆蓋本機剛打出的高分
    for(k in g){
      if(!g.hasOwnProperty(k)) continue;
      if(!MG.best[k] || (g[k] && g[k].score > MG.best[k].score)) MG.best[k] = g[k];
    }
    renderGrid();
    toast('已讀取雲端最佳成績');
  })['catch'](function(){ /* 讀不到就算了,不影響遊玩 */ });
}
function saveCloud(gid, rec){
  if(!MG.fb || !MG.user) return;
  var payload = { uid: MG.user.uid, name: (MG.user.displayName || ''), games: {} };
  payload.games[gid] = {
    score: rec.score, stars: rec.stars, acc: rec.acc, at: Date.now()
  };
  MG.fb.db.collection('minigameScores').doc(MG.user.uid)
    .set(payload, { merge: true })
    .then(function(){ $('r-cloud').textContent = '☁ 已存到雲端'; })
    ['catch'](function(){ $('r-cloud').textContent = '☁ 雲端存檔失敗(成績仍保留在這次遊戲中)'; });
}

/* ══════════════════════════════════════════════════════════
 *  開機
 * ══════════════════════════════════════════════════════════ */
function boot(){
  try{
    var st = localStorage.getItem('mg_style');
    if(st === 's' || st === 'f') MG.style = st;
  }catch(e){}

  if(!window.MG_GAMES || !window.MG_GAMES.length){
    document.getElementById('grid').innerHTML =
      '<p style="grid-column:1/-1;text-align:center;opacity:.8;">'
      + '資料載入失敗,請重新整理頁面。</p>';
    return;
  }
  MG.games = window.MG_GAMES;
  renderGrid();

  // 若上次用 redirect 登入,回來時把結果接起來(不主動載 SDK)
  if(window.firebase && MG.fb){
    try{ MG.fb.auth.getRedirectResult(); }catch(e){}
  }

  // Service Worker(只註冊本目錄,scope 比主程式更具體)
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js?v=' + MG_VER)['catch'](function(){});
    });
  }
  console.log('[小英雄小遊戲]', MG_VER, '共', MG.games.length, '款');
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
}else{
  boot();
}

})();
</script>
